# Home Assistant Add-on configuration for Yapaja Go (E08-T4, docs/04 §3).
#
# Schema reference: https://developers.home-assistant.io/docs/add-ons/configuration
# Linted (nightly, continue-on-error) via frenck/action-addon-linter -- see
# .github/workflows/nightly.yml job `addon-lint`. Per-PR CI instead runs an
# in-repo, deterministic structural check
# (yapaja_go/config.test.ts) so a flaky/unavailable third-party
# Action can never block a merge -- see yapaja_go/PACKAGING.md "CI strategy".

name: "Yapaja Go"
description: "Offline-fähige Motorhome-Navigation (Karten, Routing, GPS, MQTT/HA-Integration) als HA-Add-on."
slug: "yapaja_go"
version: "0.3.4"
url: "https://github.com/Apfelsafft/Yapaja-Go-Design"

# amd64 covers typical Mini-PC/NUC installs; aarch64 covers Raspberry Pi
# 4/5-class HAOS hardware. Other archs are intentionally NOT listed: Valhalla/
# Photon upstream images this add-on bundles do not reliably ship armhf/armv7/
# i386 builds (see DOCS.md "Supported architectures").
arch:
  - amd64
  - aarch64

# NOT SET, because both would only repeat the Supervisor default and
# `frenck/action-addon-linter` rejects redundant keys (nightly, E10-T4):
#   startup: application  -- this is the user-facing product, not a
#                            background service other add-ons depend on.
#   boot: auto            -- starts with HAOS; operators can still
#                            stop/disable it manually like any add-on.
# Both defaults are exactly what we want; spelling them out added no
# behaviour, only a lint failure.

# We ship our OWN s6-overlay (rootfs/etc/s6-overlay/, see Dockerfile) instead
# of basing on Home Assistant's own base images (which already bundle
# s6-overlay + their own init). `init: false` tells the Supervisor NOT to
# inject a second init/PID-1 on top of ours.
init: false

# Ingress (docs/04 §3): the add-on UI appears in the HA sidebar, and HA
# terminates auth + remote access (Nabu Casa) for it -- no separate
# port-forwarding/reverse-proxy needed. The INTERNAL container port the Core
# listens on is the Supervisor default (8099) and is never published to the
# host network directly (that's the whole point of Ingress) -- so
# `ingress_port` is deliberately NOT set here: it would only restate the
# default and the add-on linter rejects that (nightly, E10-T4).
ingress: true
panel_icon: "mdi:map-marker-path"
panel_title: "Yapaja Go"

# Ingress-only by default (docs/04 §3: "ports: {} (ingress-only)"). Direct
# (non-Ingress) HTTP access is an OPT-IN an operator can add locally by
# uncommenting the block below in a fork/override -- documented in
# DOCS.md "Direct (non-Ingress) access" rather than shipped enabled, since
# publishing the port also means the `API_AUTH_TOKEN` bearer-auth path (not
# the Ingress-bypass, see apps/core/src/auth/) becomes the operative one.
#
# ports:
#   8080/tcp: 8080
# ports_description:
#   8080/tcp: "Optional direct HTTP access (bypasses Ingress). Set an API_AUTH_TOKEN if you enable this."
ports: {}

# W-16: map/routing/search data lives under /share/yapaja/ (host-persistent,
# survives add-on updates/reinstalls) -- never inside the container's
# writable layer. `share:rw` mounts HAOS's shared /share into the container.
map:
  - share:rw

# bashio::services mqtt ... needs this so the Supervisor grants access to the
# Mosquitto add-on's broker credentials (docs/04 §3 "MQTT-Credentials
# automatisch"). `need` (not `want`): without MQTT the HA integration has no
# purpose here, but the Core itself still runs standalone-safe if the
# Supervisor were to unwire it after install (see AcceptanceCriteria "App
# bleibt ohne Broker voll funktional", E08-T1).
services:
  - mqtt:need

# USB-GPS passthrough (docs/04 §3, DOCS.md "USB-GPS").
usb: true
udev: true

# Yapaja -> HA REST calls (HA-TTS output channel, notifications; E08-T3,
# docs/04 §2) go through the Supervisor's proxied Core API
# (http://supervisor/core/api + SUPERVISOR_TOKEN) instead of a manually
# configured long-lived token when running as an add-on.
hassio_api: true
homeassistant_api: true

# SECURITY POSTURE -- deliberately left at the Supervisor defaults, which are
# already the hardened ones, and therefore NOT spelled out (the add-on linter
# rejects keys that only restate a default; nightly, E10-T4):
#   full_access: false  -- no elevated container privileges. usb+udev above
#                          already grant GPS device access; `true` would
#                          disable Docker's device allow-list entirely.
#   apparmor:    true   -- AppArmor confinement stays ON.
#   stdin:       false  -- no stdin channel into the container.
# Any future change here is a widening of privileges and must be argued for
# explicitly by ADDING the key with a comment saying why.

# `gps_source` -- WOHER die Position kommt. Vier Werte, und der Reihe nach:
#
#   usb        fest eingebauter GPS-Empfaenger am USB-Port (gpsd)
#   network    gpsd auf einem anderen Geraet im Netz
#   ha_tracker Home-Assistant-Companion-App auf Telefon/Tablet/Autoradio
#   none       kein eigener Empfaenger -- die Position kommt aus dem Browser
#
# `ha_tracker` fehlte bis 0.3.0 in dieser Liste. Die Quelle GAB es (0.3.0 hat
# sie gebaut), aber einschalten liess sie sich nur ueber das freie Textfeld
# `ha_device_tracker` darunter -- und dafuer musste man erst wissen, dass es
# eine Entity-ID gibt, und sie dann in Home Assistant unter
# Entwicklerwerkzeuge -> Zustaende abschreiben. In der Konfiguration stand an
# der Stelle, an der man nachsieht, nur „usb". Eine Funktion, die man nicht
# findet, ist keine.
#
# `ha_tracker` genuegt jetzt fuer sich allein: gibt es genau EINEN
# `device_tracker` mit Koordinaten -- der Normalfall --, waehlt Yapaja ihn
# selbst. Gibt es mehrere, wird bewusst KEINER geraten (der zweite koennte
# das Telefon einer anderen Person sein); dann nennt die Installationspruefung
# sie beim Namen und man traegt den gewuenschten unten ein.
#
# `ha_device_tracker` (B-05): Entity-ID, z. B. `device_tracker.mein_telefon`.
# Leer = automatisch (siehe oben). Nur noetig, wenn es mehrere gibt.
#
# Der Weg fuer Telefon/Tablet/Autoradio, wenn der Browser den GPS-Sensor gar
# nicht freigibt -- ohne HTTPS tut er das nie, und Home Assistant laeuft in
# vielen Installationen ueber einfaches HTTP (docs/gps-endgeraete.md). Die
# Companion App meldet an Home Assistant statt an den Browser und liefert auch
# bei gesperrtem Bildschirm weiter.
#
# Welche Entitaeten in Frage kommen, sagt die Installationspruefung (🩺):
# sie listet alle gefundenen `device_tracker.*` MIT Koordinaten auf. Einer
# ohne Koordinaten (nur „home"/„not home" per WLAN) taugt nicht als
# Positionsquelle und wird deshalb gar nicht erst angeboten. (Dieser Satz
# stand hier schon in 0.3.0 und war da noch eine Zusage ohne Deckung -- die
# Pruefung listete nichts. `apps/core/src/system/preflight.ts` tut es seit
# 0.3.1 wirklich, und `preflight.test.ts` haelt es fest.)
#
# Options (docs/04 §3 "Kartenregion, MQTT-Prefix, Photon an/aus, GPS-Quelle,
# Log-Level" + memory tuning). `region: ""` (empty) is a VALID, EXPECTED
# state: the Core starts into onboarding (E08-T5 builds the wizard UI; T4
# only guarantees no crash -- see rootfs .../init-yapaja-config/run.sh and
# DOCS.md "Plausibilität: kein Crash ohne Region").
options:
  region: ""
  mqtt_prefix: "yapaja"
  photon_enabled: true
  # Voreinstellung `none` statt `usb`: ein USB-GPS-Empfaenger ist Zubehoer,
  # das die wenigsten haben. Mit `usb` meldete die Installationspruefung bei
  # jeder frischen Installation „gpsd ist eingeschaltet, antwortet aber nicht
  # unter 127.0.0.1:2947" -- eine Warnung ueber ein Geraet, das nie da war.
  # Wer einen Empfaenger hat, stellt hier `usb` ein; das ist die Reihenfolge,
  # in der man es merkt. (Bestehende Installationen behalten ihre eigene
  # Einstellung -- Vorgaben gelten nur fuer neue.)
  gps_source: "none"
  ha_device_tracker: ""
  log_level: "info"
  photon_xmx_mb: 1024
  valhalla_memory_mb: 2048

schema:
  region: "str?"
  mqtt_prefix: "str"
  photon_enabled: "bool"
  gps_source: "list(usb|network|ha_tracker|none)"
  ha_device_tracker: "str?"
  log_level: "list(debug|info|warn|error)"
  photon_xmx_mb: "int(256,4096)"
  valhalla_memory_mb: "int(512,8192)"

# KEIN `image:` -- und das ist eine bewusste Entscheidung, keine Auslassung.
#
# Steht hier ein `image:`, ZIEHT der Supervisor dieses Image aus einer
# Registry und baut NICHTS lokal. Bis 2026-09-02 stand hier
# `ghcr.io/yapaja/yapaja-go-{arch}`. Dieses Image existiert nicht und hat nie
# existiert: `yapaja` ist nicht einmal der Namensraum dieses Repositories
# (das waere `apfelsafft`), und kein einziger Workflow hat je
# `yapaja_go/Dockerfile` gebaut oder gepusht -- `publish-images` in
# `release.yml` baut `apps/core/Dockerfile`, also den eigenstaendigen Core,
# nicht dieses Add-on. Die Folge war ein Installationsabbruch, den niemand
# selbst beheben konnte:
#
#   Can't install ghcr.io/yapaja/yapaja-go-amd64:0.1.0:
#   [403] Head ".../manifests/0.1.0": denied
#
# Ohne `image:` baut der Supervisor das Add-on aus `Dockerfile` auf dem
# Geraet -- genau das, was `DOCS.md` und `docs/installation.md` §A Schritt 2
# seit jeher beschreiben („Der Container wird dabei auf dem Geraet gebaut --
# 10-30 Minuten"). Konfiguration und Dokumentation widersprachen sich; die
# Dokumentation hatte recht.
#
# Wer spaeter fertige Images ausliefern will, braucht BEIDES: diesen
# Schluessel UND einen Workflow, der `yapaja_go/Dockerfile` fuer alle unter
# `arch:` genannten Architekturen baut und in genau diesen Namensraum pusht.
# `config.test.ts` erzwingt diese Kopplung -- ein `image:` ohne
# veroeffentlichenden Workflow laesst die Tests fehlschlagen.

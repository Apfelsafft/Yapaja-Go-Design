# Home Assistant Add-on configuration for Yapaia Go (E08-T4, docs/04 §3).
#
# Schema reference: https://developers.home-assistant.io/docs/add-ons/configuration
# Linted (nightly, continue-on-error) via frenck/action-addon-linter -- see
# .github/workflows/nightly.yml job `addon-lint`. Per-PR CI instead runs an
# in-repo, deterministic structural check
# (yapaja_go/config.test.ts) so a flaky/unavailable third-party
# Action can never block a merge -- see yapaja_go/PACKAGING.md "CI strategy".

name: "Yapaia Go"
description: "Offline-fähige Motorhome-Navigation (Karten, Routing, GPS, MQTT/HA-Integration) als HA-Add-on."
slug: "yapaja_go"
version: "0.8.13"
# ─── MINDESTVERSION VON HOME ASSISTANT ──────────────────────────────────────
# Seit 0.8.4 sind die selten angefassten Optionen in aufklappbaren Gruppen
# zusammengefasst. Verschachtelte Konfiguration gibt es in Home Assistant aber
# erst ab 2025.10 (maximal zwei Ebenen). Auf einer aelteren Installation wuerde
# die Konfigurationsseite die Gruppen nicht zeichnen -- und wer sie nicht sieht,
# kann Photon, das Routing-Budget und die HA-Kanaele nicht mehr einstellen.
#
# Lieber der Supervisor sagt „zu alt" als eine Seite, auf der die Haelfte fehlt.
homeassistant: "2025.10.0"
url: "https://github.com/Apfelsafft/Yapaja-Go-Design"

# amd64 covers typical Mini-PC/NUC installs; aarch64 covers Raspberry Pi
# 4/5-class HAOS hardware. Other archs are intentionally NOT listed: Valhalla/
# Photon upstream images this add-on bundles do not reliably ship armhf/armv7/
# i386 builds (see DOCS.md "Supported architectures").
arch:
  - amd64
  - aarch64

# NOT SET, because both would only repeat the Supervisor default and
# `frenck/action-addon-linter` rejects redundant keys (nightly, E10-T4):
#   startup: application  -- this is the user-facing product, not a
#                            background service other add-ons depend on.
#   boot: auto            -- starts with HAOS; operators can still
#                            stop/disable it manually like any add-on.
# Both defaults are exactly what we want; spelling them out added no
# behaviour, only a lint failure.

# We ship our OWN s6-overlay (rootfs/etc/s6-overlay/, see Dockerfile) instead
# of basing on Home Assistant's own base images (which already bundle
# s6-overlay + their own init). `init: false` tells the Supervisor NOT to
# inject a second init/PID-1 on top of ours.
init: false

# Ingress (docs/04 §3): the add-on UI appears in the HA sidebar, and HA
# terminates auth + remote access (Nabu Casa) for it -- no separate
# port-forwarding/reverse-proxy needed. The INTERNAL container port the Core
# listens on is the Supervisor default (8099) and is never published to the
# host network directly (that's the whole point of Ingress) -- so
# `ingress_port` is deliberately NOT set here: it would only restate the
# default and the add-on linter rejects that (nightly, E10-T4).
ingress: true
panel_icon: "mdi:map-marker-path"
panel_title: "Yapaia Go"

# Ingress-only by default (docs/04 §3: "ports: {} (ingress-only)"). Direct
# (non-Ingress) HTTP access is an OPT-IN an operator can add locally by
# uncommenting the block below in a fork/override -- documented in
# DOCS.md "Direct (non-Ingress) access" rather than shipped enabled, since
# publishing the port also means the `API_AUTH_TOKEN` bearer-auth path (not
# the Ingress-bypass, see apps/core/src/auth/) becomes the operative one.
#
# ports:
#   8080/tcp: 8080
# ports_description:
#   8080/tcp: "Optional direct HTTP access (bypasses Ingress). Set an API_AUTH_TOKEN if you enable this."
ports: {}

# W-16: map/routing/search data lives under /share/yapaja/ (host-persistent,
# survives add-on updates/reinstalls) -- never inside the container's
# writable layer. `share:rw` mounts HAOS's shared /share into the container.
map:
  - share:rw
  # ─── WOFUER SCHREIBZUGRIFF AUF DIE HA-KONFIGURATION ───────────────────────
  # Ausschliesslich, um die Lovelace-Karte (`lovelace/yapaja-map-card.js`) beim
  # Start nach `www/yapaja/` zu legen. Home Assistant liefert alles unter `www/`
  # als `/local/...` aus -- das ist der EINZIGE Pfad, unter dem eine
  # Dashboard-Ressource dauerhaft gueltig bleibt. Ueber Ingress ginge es nicht:
  # dessen Pfad enthaelt ein wechselndes Token.
  #
  # Ohne diesen Zugriff muesste die Datei von Hand kopiert werden -- also per
  # SSH oder Datei-Editor. Der Betreiber hat ausdruecklich gesagt, dass er alles
  # aus der Oberflaeche heraus machen moechte und nicht ueber SSH.
  #
  # Geschrieben wird NUR diese eine Datei in genau diesem Unterordner; das
  # Init-Skript fasst nichts anderes an.
  - homeassistant_config:rw

# bashio::services mqtt ... needs this so the Supervisor grants access to the
# Mosquitto add-on's broker credentials (docs/04 §3 "MQTT-Credentials
# automatisch"). `need` (not `want`): without MQTT the HA integration has no
# purpose here, but the Core itself still runs standalone-safe if the
# Supervisor were to unwire it after install (see AcceptanceCriteria "App
# bleibt ohne Broker voll funktional", E08-T1).
services:
  # `want`, NICHT `need` -- seit 0.7.0 gibt es einen zweiten Weg zu Home
  # Assistant (`ha_internal`, siehe unten). `need` heisst „ohne das hier
  # ergibt dieses Add-on keinen Sinn"; das stimmt seither nicht mehr, und wer
  # `mqtt_enabled` ausschaltet, soll nicht trotzdem einen Broker vorhalten
  # muessen. Die Zugangsdaten kommen bei einem vorhandenen Broker unveraendert
  # automatisch (docs/04 §3 „MQTT-Credentials automatisch").
  - mqtt:want

# ─── USB-GPS: SICHTBAR IST NICHT GEOEFFNET ──────────────────────────────────
# `usb: true` reicht den rohen USB-Bus herein, `udev: true` die udev-Ereignisse.
# Damit ERSCHEINT der Empfaenger unter /dev/serial/by-id/ -- die
# Installationspruefung listete ihn, `find-gps-device.sh` waehlte ihn aus, und
# das Protokoll meldete „benutze /dev/serial/by-id/usb-u-blox_AG_-…".
#
# OEFFNEN durfte der Container ihn trotzdem nicht. gpsd sagte es, sobald es
# gefragt wurde (0.8.9 hat es gefragt):
#
#   gpsd:ERROR: SER: device open of /dev/serial/by-id/usb-u-blox_AG_-… failed:
#                    Operation not permitted(1) - retrying read-only
#   gpsd:ERROR: initial GPS device … open failed
#   gpsd:ERROR: can't run with neither control socket nor devices open
#
# Danach beendete sich gpsd, s6 startete den Dienst neu, die Geraetesuche lief
# erneut und meldete wieder Erfolg -- im Sekundentakt, und nirgends stand, dass
# etwas fehlschlug.
#
# Der Schluessel dafuer heisst `uart`. Er bildet die seriellen Geraete des
# Wirts in den Container ab, MIT den Rechten, sie zu oeffnen. Zum Vergleich:
# das ESPHome-Add-on, das ueber USB-Seriell flasht, deklariert `uart: true`
# und gar kein `usb`.
uart: true

# `usb`/`udev` bleiben vorerst stehen: `udev` liefert die Ereignisse, an denen
# ein spaeter eingestecktes Geraet ueberhaupt auffaellt. Ob `usb` daneben noch
# gebraucht wird, ist offen -- ESPHome kommt ohne aus. Es hier zu entfernen,
# waere eine zweite Aenderung an derselben Stelle im selben Schritt; erst soll
# der Empfaenger laufen. Siehe DOCS.md, Abschnitt "USB-GPS".
usb: true
udev: true

# Yapaia -> HA REST calls (HA-TTS output channel, notifications; E08-T3,
# docs/04 §2) go through the Supervisor's proxied Core API
# (http://supervisor/core/api + SUPERVISOR_TOKEN) instead of a manually
# configured long-lived token when running as an add-on.
hassio_api: true
homeassistant_api: true

# SECURITY POSTURE -- deliberately left at the Supervisor defaults, which are
# already the hardened ones, and therefore NOT spelled out (the add-on linter
# rejects keys that only restate a default; nightly, E10-T4):
#   full_access: false  -- no elevated container privileges. usb+udev above
#                          already grant GPS device access; `true` would
#                          disable Docker's device allow-list entirely.
#   apparmor:    true   -- AppArmor confinement stays ON.
#   stdin:       false  -- no stdin channel into the container.
# Any future change here is a widening of privileges and must be argued for
# explicitly by ADDING the key with a comment saying why.

# `gps_source` -- WOHER die Position kommt. Vier Werte, und der Reihe nach:
#
#   usb           fest eingebauter GPS-Empfaenger am USB-Port (gpsd)
#   network       gpsd auf einem anderen Geraet im Netz
#   companion_app Home-Assistant-Companion-App auf Telefon/Tablet/Autoradio
#   none          kein eigener Empfaenger -- die Position kommt aus dem Browser
#
# `ha_tracker` hiess dieser Wert bis 0.8.2. Umbenannt wurde er, weil er den
# WEG beschrieb (eine device_tracker-Entitaet) und nicht die Sache: wer die
# Option einstellt, sucht das Wort „Companion App". Bis 0.8.7 stand der alte
# Wert zusaetzlich in dieser Liste, damit ein Update keine bestehende
# Installation still ohne Positionsquelle laesst -- bezahlt mit ZWEI Knoepfen
# in der Konfigurationsseite, die dasselbe bedeuten.
#
# Seit 0.8.8 ist er weg. Der Betreiber hat geklaert, dass es keine fremden
# Installationen gibt, auf die Ruecksicht zu nehmen waere. Wer den alten Wert
# gespeichert hat, waehlt einmal `companion_app`.
#
# NICHT betroffen: `Position.source` heisst weiterhin `ha_tracker`. Das ist
# Uebertragungsformat (nav/state, MQTT, HA-Entitaeten), keine Konfiguration.
#
# Der Wert fehlte bis 0.3.0 in dieser Liste. Die Quelle GAB es (0.3.0 hat
# sie gebaut), aber einschalten liess sie sich nur ueber das freie Textfeld
# `ha_device_tracker` darunter -- und dafuer musste man erst wissen, dass es
# eine Entity-ID gibt, und sie dann in Home Assistant unter
# Entwicklerwerkzeuge -> Zustaende abschreiben. In der Konfiguration stand an
# der Stelle, an der man nachsieht, nur „usb". Eine Funktion, die man nicht
# findet, ist keine.
#
# `companion_app` genuegt fuer sich allein: gibt es genau EINEN
# `device_tracker` mit Koordinaten -- der Normalfall --, waehlt Yapaia ihn
# selbst. Gibt es mehrere, wird bewusst KEINER geraten (der zweite koennte
# das Telefon einer anderen Person sein); dann nennt die Installationspruefung
# sie beim Namen und man traegt den gewuenschten unten ein.
#
# `ha_device_tracker` (B-05): Entity-ID, z. B. `device_tracker.mein_telefon`.
# Leer = automatisch (siehe oben). Nur noetig, wenn es mehrere gibt.
#
# Der Weg fuer Telefon/Tablet/Autoradio, wenn der Browser den GPS-Sensor gar
# nicht freigibt -- ohne HTTPS tut er das nie, und Home Assistant laeuft in
# vielen Installationen ueber einfaches HTTP (docs/gps-endgeraete.md). Die
# Companion App meldet an Home Assistant statt an den Browser und liefert auch
# bei gesperrtem Bildschirm weiter.
#
# Welche Entitaeten in Frage kommen, sagt die Installationspruefung (🩺):
# sie listet alle gefundenen `device_tracker.*` MIT Koordinaten auf. Einer
# ohne Koordinaten (nur „home"/„not home" per WLAN) taugt nicht als
# Positionsquelle und wird deshalb gar nicht erst angeboten. (Dieser Satz
# stand hier schon in 0.3.0 und war da noch eine Zusage ohne Deckung -- die
# Pruefung listete nichts. `apps/core/src/system/preflight.ts` tut es seit
# 0.3.1 wirklich, und `preflight.test.ts` haelt es fest.)
#
# Options (docs/04 §3 "Kartenregion, MQTT-Prefix, Photon an/aus, GPS-Quelle,
# Log-Level" + memory tuning). `region: ""` (empty) is a VALID, EXPECTED
# state: the Core starts into onboarding (E08-T5 builds the wizard UI; T4
# only guarantees no crash -- see rootfs .../init-yapaja-config/run.sh and
# DOCS.md "Plausibilität: kein Crash ohne Region").
# ─── DIE ZWEI WEGE ZU HOME ASSISTANT ────────────────────────────────────────
#
# `mqtt_enabled` -- der Weg ueber einen MQTT-Broker (Mosquitto-Add-on).
#   Liefert vollwertige Entitaeten MIT Geraet, mit Verlauf, und die
#   bedienbaren: die Schaltflaechen Pause/Weiter/Beenden und die
#   Profilauswahl. Dafuer braucht es den Broker.
#
# `ha_internal` -- der Weg ohne Broker.
#   Der Core schreibt die Werte direkt ueber die Home-Assistant-API
#   (`apps/core/src/ha/statesBridge.ts`). Es entstehen dieselben Entity-IDs
#   (`sensor.yapaja_speed` und so fort), lesbar von Automationen, Vorlagen,
#   ESPHome und jedem Dashboard. Eine so geschriebene Entitaet kann selbst
#   keine Befehle entgegennehmen -- BEDIENEN geht auf diesem Weg trotzdem:
#   Yapaia legt dafuer Helfer an (`input_button.yapaia_pause` und
#   Geschwister) und fuehrt aus, was gedrueckt wird
#   (`apps/core/src/ha/commandHelpers.ts`). In 0.7.0 stand hier noch, es gehe
#   nicht; das war zu frueh aufgegeben.
#
# BEIDE ZUGLEICH ist erlaubt und sinnvoll. Sie streiten sich nicht: solange
# MQTT verbunden ist und die Entitaeten liefert, haelt sich der interne Kanal
# zurueck -- zwei Schreiber auf derselben Entitaet ergaeben ein Flackern, bei
# dem niemand mehr sagen kann, welcher Wert gilt. Faellt der Broker aus,
# uebernimmt der interne Kanal, und die Werte laufen weiter.
# Dasselbe gilt fuer die Bedienung: mit MQTT ruhen die Helfer, sonst gaebe es
# zwei Saetze Knoepfe fuer dieselbe Sache.
options:
  region: ""
  # Voreinstellung `none` statt `usb`: ein USB-GPS-Empfaenger ist Zubehoer,
  # das die wenigsten haben. Mit `usb` meldete die Installationspruefung bei
  # jeder frischen Installation „gpsd ist eingeschaltet, antwortet aber nicht
  # unter 127.0.0.1:2947" -- eine Warnung ueber ein Geraet, das nie da war.
  # Wer einen Empfaenger hat, stellt hier `usb` ein; das ist die Reihenfolge,
  # in der man es merkt. (Bestehende Installationen behalten ihre eigene
  # Einstellung -- Vorgaben gelten nur fuer neue.)
  gps_source: "none"
  # `gps_device` -- WELCHER USB-Anschluss der GPS-Empfaenger ist.
  #
  # Leer lassen ist der Normalfall: Yapaia sucht sich das Geraet selbst.
  # Eintragen muss man nur, wenn die Installationspruefung oder das
  # Add-on-Protokoll ausdruecklich danach fragt -- naemlich dann, wenn mehrere
  # serielle Geraete angesteckt sind und keines sich von selbst als
  # GNSS-Empfaenger zu erkennen gibt.
  #
  # Das ist auf einem Home-Assistant-Rechner nicht selten: ein Zigbee-
  # Koordinator (SkyConnect, Sonoff, ConBee) oder ein Z-Wave-Stick meldet sich
  # unter genau denselben Namen wie ein GPS-Empfaenger. Bis 0.8.1 nahm Yapaia
  # einfach das erste und schrieb beim Erkennen darauf -- auf ein Geraet, das
  # einem anderen Add-on gehoert.
  #
  # Bitte den stabilen Pfad nehmen, nicht /dev/ttyACM0:
  #
  #   /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_7_-_GPS_GNSS_Receiver-if00
  #
  # Die Nummer in `ttyACM0` verschiebt sich, sobald ein anderer USB-Stick
  # dazukommt oder wegfaellt; der `by-id`-Pfad bleibt. Welche Pfade es auf
  # Ihrem Geraet gibt, zeigt die Installationspruefung in Yapaia an.
  gps_device: ""
  ha_device_tracker: ""
  search:
    photon_enabled: true
    photon_xmx_mb: 1024
  routing:
    valhalla_memory_mb: 2048
  # `display.theme` -- Hell, Dunkel oder automatisch.
  #
  # Das ist eine VORGABE, keine Festlegung: sie gilt fuer Geraete, die in
  # Yapaia noch nichts gewaehlt haben. Wer dort unter „Design" etwas auswaehlt,
  # ueberschreibt sie fuer sein Geraet -- ein Tablet in der Sonne und ein
  # Telefon nachts brauchen nicht dasselbe.
  #
  # Die beiden automatischen Betriebsarten sind NICHT dasselbe:
  #   system  folgt dem Geraet (dessen Hell/Dunkel-Einstellung)
  #   sun     folgt dem Sonnenstand an der eigenen Position -- fuer ein
  #           Fahrzeug meist das Bessere: dunkel wird es, wenn es draussen
  #           dunkel wird, unabhaengig davon, wie das Tablet eingestellt ist.
  display:
    theme: "light"
  home_assistant:
    ha_internal: true
    mqtt_enabled: true
    mqtt_prefix: "yapaja"
  advanced:
    # `gps_simulator` -- den eingebauten Testfahrer freischalten.
    #
    # AUS als Vorgabe, und das ist der wichtige Teil: der Simulator kann
    # beliebige Positionen einspeisen und verdraengt dabei den echten
    # Empfaenger. Auf einem fahrenden Fahrzeug darf das nicht aus Versehen
    # gehen -- deshalb bleibt er verschlossen, bis jemand ihn ausdruecklich
    # aufschliesst.
    #
    # Bis 0.5.7 gab es diesen Schalter nicht, und der Simulator war damit im
    # Add-on UEBERHAUPT nicht erreichbar: der Core laeuft hier mit
    # NODE_ENV=production, und dort antworten alle Simulator-Routen mit 403,
    # solange ENABLE_SIMULATOR nicht gesetzt ist. Die Funktion war gebaut,
    # getestet -- und hinter einer Tuer ohne Klinke.
    #
    # Wieder einschalten: Einstellungen -> Add-ons -> Yapaia Go ->
    # Konfiguration, Haken setzen, Add-on neu starten. Kein SSH noetig.
    gps_simulator: false
    log_level: "info"

# ─── GLIEDERUNG ────────────────────────────────────────────────────────────
# Was man wirklich einstellt, steht OFFEN da; der Rest liegt in aufklappbaren
# Bloecken. Genau die Form, die das Add-on „Terminal & SSH" benutzt (dort der
# Block „Server"): ein verschachtelter Schluessel im Schema wird von Home
# Assistant als eigener, zusammenklappbarer Abschnitt gezeichnet.
#
# Die Alternative -- alles flach, die Gruppe nur im Namen -- stand bis 0.8.3
# hier und war ein Kompromiss: zwoelf Felder untereinander, die Gliederung nur
# als Text im Etikett. Aufgeklappt wird jetzt nur, was man selten anfasst.
#
# Die Gruppenschluessel sind ENGLISCH wie alle anderen Schluessel auch
# (`photon_enabled`, `log_level`); was der Betreiber liest, steht in
# `translations/` und ist deutsch.
#
# ACHTUNG BEIM UMSTIEG: die Schluessel liegen damit an einer anderen Stelle in
# der gespeicherten Konfiguration. `init-yapaja-config.sh` liest deshalb BEIDE
# Formen -- erst die neue, dann die alte (siehe `config_mit_rueckfall` dort).
schema:
  region: "str?"
  gps_source: "list(usb|network|companion_app|none)"
  gps_device: "str?"
  ha_device_tracker: "str?"
  search:
    photon_enabled: "bool"
    photon_xmx_mb: "int(256,4096)"
  routing:
    valhalla_memory_mb: "int(512,8192)"
  display:
    theme: "list(light|dark|system|sun)"
  home_assistant:
    ha_internal: "bool"
    mqtt_enabled: "bool"
    mqtt_prefix: "str"
  advanced:
    gps_simulator: "bool"
    log_level: "list(debug|info|warn|error)"

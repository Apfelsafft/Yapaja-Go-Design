name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build

  addon-config-check:
    name: HA Add-on Config Validity (E08-T4)
    runs-on: ubuntu-latest
    # Bewusst KEIN `needs: quality` -- eigenstaendig, mirrors valhalla-li-
    # build/lite-search-li-build's Begruendung: schnell, in-repo, keine
    # Abhaengigkeit vom Rest der Suite. Der eigentliche `frenck/action-
    # addon-linter` (Drittanbieter-Action, Schema-Vollpruefung) laeuft
    # bewusst NICHT hier, sondern nightly mit continue-on-error --
    # Begruendung: ha-addon/README.md "CI strategy". Dieser Job prueft nur
    # die konkreten, in tasks/E08-home-assistant.md + docs/04 §3 genannten
    # Pflicht-Keys (ingress, slug, arch, map, services, options/schema),
    # rein in-repo via ha-addon/yapaja_go/config.test.ts (Vitest + js-yaml)
    # -- deterministisch, kein Netzwerk, kann daher gefahrlos Merge-Gate sein.
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate ha-addon/yapaja_go/config.yaml structure
        run: npx vitest run ha-addon/yapaja_go/config.test.ts

      - name: Lint ha-addon/ TypeScript (config.test.ts)
        run: npx eslint ha-addon --ext .ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub runners do not have the sandbox's pre-installed Chromium at
      # PLAYWRIGHT_BROWSERS_PATH; the playwright config falls back to Playwright's
      # own browser resolution when that env var is unset, so install it here.
      - name: Install Playwright Chromium
        run: pnpm --filter @yapaja/web exec playwright install --with-deps chromium

      # globalSetup builds web+core and starts the core; run the suite.
      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  security-suite:
    name: Security Suite (Sandbox-Escape, E09-T6, W-10)
    runs-on: ubuntu-latest
    needs: quality
    # Bewusst ein EIGENER Job neben `e2e`: die Suite (e2e/security/) startet
    # genau EINEN dedizierten Core (Port 4340) statt der ~17 der Haupt-Harness,
    # laeuft mit `workers: 1` und `retries: 0` (eine Sicherheitsaussage wird
    # NIE gruen retried, gleiche Regel wie beim Golden-Route-Gate, docs/07 §3b)
    # und muss von einem flakenden UI-Spec unabhaengig sein. Laufzeit lokal
    # gemessen: Build ~50 s + Suite ~40 s; der Mutations-Nachweis (Akzeptanz-
    # kriterium 2) sind drei weitere gefilterte Laeufe, zusammen ~5 min --
    # deutlich unter dem `e2e`-Job und daher per Push/PR tragbar statt nightly.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub-Runner haben die vorinstallierte Chromium-Revision unter
      # PLAYWRIGHT_BROWSERS_PATH nicht; die Config faellt dann auf Playwrights
      # eigene Aufloesung zurueck, also hier installieren (wie im e2e-Job).
      - name: Install Playwright Chromium
        run: pnpm --filter @yapaja/web exec playwright install --with-deps chromium

      # e2e/ ist KEIN Workspace-Paket, `pnpm typecheck` (= `pnpm -r`) deckt es
      # nicht ab -- gleiche Begruendung wie beim golden-routes-Job.
      - name: Typecheck security suite
        run: pnpm exec tsc --noEmit -p e2e/security/tsconfig.json

      # Akzeptanzkriterien 1 + 3: alle Angriffsvektoren geblockt UND als
      # `security`-Event geloggt, verdrahtet in der Pipeline.
      - name: Run security suite (all vectors blocked + logged)
        run: pnpm e2e:security

      # Akzeptanzkriterium 2: die Suite bricht nachweislich, wenn man eine
      # Schutzmassnahme deaktiviert (echter Patch auf echtem Quellcode,
      # kein Feature-Flag). Siehe e2e/security/README.md.
      - name: Mutation proof (the suite really detects a removed protection)
        run: pnpm security:mutation-proof

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-traces
          path: e2e/security/.tmp/test-results/
          retention-days: 7
          if-no-files-found: ignore

  perf-budgets:
    name: Performance-Budgets (E10-T2, N100-Profil)
    runs-on: ubuntu-latest
    needs: quality
    # Eigener Job neben `e2e`, aus demselben Grund wie `security-suite`: die
    # Suite (e2e/perf/) startet genau EINEN dedizierten Core (Port 4350),
    # laeuft mit `workers: 1` und `retries: 0` -- eine wiederholte Messung
    # ist keine Messung -- und darf von einem flakenden UI-Spec nicht
    # abhaengen. Laufzeit lokal gemessen: Build ~50 s + Suite ~2,7 min.
    #
    # WICHTIG fuer die Lesart der Ergebnisse (Details: e2e/perf/README.md):
    #  * Messbar ist hier der RSS des Core-Prozesses. Valhalla/Photon/gpsd
    #    laufen in dieser Pipeline NICHT als Dienste (die Jobs unten bauen
    #    Fixtures und smoke-testen); ihr RSS wird als `not_measured` mit
    #    Begruendung ausgewiesen und NICHT geschaetzt.
    #  * Die fps-Metriken werden gemessen, aber auf GitHub-Runnern ohne GPU
    #    (SwiftShader-Softwarerasterung) nicht als Merge-Gate gewertet. Die
    #    30-fps-Schwelle bleibt unveraendert; die Einstufung leitet die Suite
    #    zur Laufzeit aus dem GL-Renderer-String ab, auf einem Runner mit
    #    echter GPU gatet sie automatisch hart.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @yapaja/web exec playwright install --with-deps chromium

      # e2e/ ist KEIN Workspace-Paket, `pnpm typecheck` (= `pnpm -r`) deckt es
      # nicht ab -- gleiche Begruendung wie bei golden-routes/security.
      - name: Typecheck perf suite
        run: pnpm exec tsc --noEmit -p e2e/perf/tsconfig.json

      # Akzeptanzkriterium 1: alle in dieser Umgebung messbaren Budgets
      # gemessen und gegen docs/00 + docs/01 §4 bewertet.
      - name: Measure performance budgets
        run: pnpm perf

      - name: Trend-Kommentar in die Job-Summary schreiben
        if: always()
        run: cat e2e/perf/.tmp/perf-trend.md >> "$GITHUB_STEP_SUMMARY" || true

      # Das JSON-Artefakt (Aufgabenstellung: "Ergebnisse als JSON-Artefakt").
      # Ein gruenes Artefakt von `main` ist zugleich die Referenz, gegen die
      # ein spaeterer Lauf per `PERF_BASELINE` das Regressions-Gate fahren kann.
      - name: Upload perf artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budgets
          path: |
            e2e/perf/.tmp/perf-results.json
            e2e/perf/.tmp/perf-trend.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: e2e/perf/.tmp/test-results/
          retention-days: 7
          if-no-files-found: ignore

  perf-degradation-proof:
    name: Perf-Degradations-Nachweis (E10-T2 Akzeptanz 2)
    runs-on: ubuntu-latest
    needs: quality
    # Akzeptanzkriterium 2: "kuenstliche Verschlechterung (Test-Fixture mit
    # 200 ms-Delay) macht Pipeline nachweislich rot". Bewusst ein EIGENER Job
    # neben `perf-budgets` (analog zum Mutations-Nachweis der Sicherheits-
    # Suite, der dort im selben Job laeuft, hier aber vier weitere
    # Suite-Laeufe braucht und den Budget-Job sonst ueber sein Zeitbudget
    # heben wuerde). Laufzeit lokal gemessen: ~9 min.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @yapaja/web exec playwright install --with-deps chromium

      - name: Degradation proof (200 ms fixture must turn the pipeline red)
        run: pnpm perf:degradation-proof

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f apps/core/Dockerfile -t yapaja-core:ci .

      - name: Start container
        run: docker run -d --name core -p 8080:8080 yapaja-core:ci

      - name: Wait for container health
        run: |
          timeout 60 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" core)" = "healthy" ]; do
              sleep 1
            done
          '

      - name: Check health endpoint
        run: curl -f http://localhost:8080/api/v1/health

      - name: Check home page
        run: curl -fs http://localhost:8080/ | grep -q "Yapaja Go"

      - name: Verify non-root user
        run: '[ "$(docker exec core whoami)" != "root" ]'

      - name: Check image size
        run: |
          SIZE_BYTES=$(docker image inspect --format='{{.Size}}' yapaja-core:ci)
          SIZE_MB=$((SIZE_BYTES / 1000000))
          echo "Image size: ${SIZE_MB} MB"
          [ "$SIZE_MB" -lt 350 ]

      - name: Show logs on failure
        if: failure()
        run: docker logs core

  valhalla-li-build:
    name: Valhalla LI Graph Build & Route Smoke
    runs-on: ubuntu-latest
    # Bewusst KEIN `needs: quality` -- reine Routing-Infra (E03-T1), rührt
    # keinen App-Code an. Der Liechtenstein-Graph ist winzig (~25s
    # End-to-End im Spike gemessen), daher als eigener, schneller
    # per-PR-Gate-Job tragbar statt nur nightly.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uebt services/valhalla/build-tiles.sh end-to-end aus: Download der
      # LI-PBF durch das gis-ops-Image (ADR-014), Graph-Build in
      # data/valhalla/tiles.new, service_limits-Overrides-Merge, und den
      # atomischen Swap tiles.new -> tiles (W-17). Beweist Akzeptanz #1+#3.
      - name: Build Liechtenstein tileset via build-tiles.sh (atomic swap, W-17)
        run: |
          chmod +x services/valhalla/build-tiles.sh
          services/valhalla/build-tiles.sh https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf

      - name: Verify atomic swap result on disk
        run: |
          test -d data/valhalla/tiles || { echo "::error::data/valhalla/tiles fehlt nach dem Swap"; exit 1; }
          test -f data/valhalla/tiles/valhalla.json || { echo "::error::valhalla.json fehlt im geschwenkten Tiles-Verzeichnis"; exit 1; }
          test ! -d data/valhalla/tiles.new || { echo "::error::tiles.new haette nach dem Swap nicht mehr existieren duerfen"; exit 1; }
          test ! -d data/valhalla/tiles.old || { echo "::error::tiles.old haette nach dem Swap aufgeraeumt sein sollen"; exit 1; }
          echo "Atomarer Swap OK: tiles.new -> tiles, kein Leftover."

      - name: Show effective service_limits (image defaults, informational)
        run: jq '.service_limits' data/valhalla/tiles/valhalla.json || echo "::warning::service_limits nicht lesbar -- blockiert diesen Job nicht (service_limits-Tuning ist vertagt, siehe services/valhalla/README.md)."

      # Startet Valhalla exakt wie docker-compose.yml es im Normalbetrieb tut
      # (serve-only, kein Rebuild) -- beweist, dass die Compose-Konfiguration
      # den von build-tiles.sh geschwenkten Tiles-Stand tatsaechlich servieren
      # kann.
      - name: Start Valhalla serving the swapped tiles (as docker-compose.yml does)
        run: |
          docker run -d --name valhalla \
            -p 8002:8002 \
            -v "$PWD/data/valhalla/tiles:/custom_files" \
            -e tile_urls= \
            -e serve_tiles=True \
            -e force_rebuild=False \
            -e build_elevation=False \
            -e build_admins=True \
            -e build_time_zones=False \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest

      - name: Wait for /status
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8002/status >/dev/null 2>&1; then
              echo "Valhalla beantwortet /status nach ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Valhalla kam nicht rechtzeitig hoch (serve-only aus vorgebauten Tiles)"
              docker logs valhalla 2>&1 | tail -150
              exit 1
            fi
            sleep 2
          done

      # Beweist Akzeptanz #2: echtes LKW-Routing auf dem LI-Graph mit
      # Plausibilitaets-Assertion (docs/03: ~3-6 km / 5-12 min fuer
      # Vaduz->Schaan; hier leicht gelockert gegen Flakes durch
      # Routen-Umwege, siehe Spike-Ergebnis 3,17 km / 4,2 min).
      - name: Smoke - truck route Vaduz -> Schaan, plausibility assertion
        run: |
          echo "== /status =="
          curl -sf http://localhost:8002/status | tee status.json
          echo
          echo "== /route (costing=truck) =="
          curl -sf http://localhost:8002/route \
            -H 'Content-Type: application/json' \
            -d '{"locations":[{"lat":47.1410,"lon":9.5209},{"lat":47.1665,"lon":9.5093}],"costing":"truck","directions_options":{"units":"kilometers"}}' \
            | tee route.json
          echo
          python3 - <<'PY'
          import json
          d = json.load(open("route.json"))
          s = d["trip"]["summary"]
          km, minutes = s["length"], s["time"] / 60
          print(f"Route: {km:.2f} km, {minutes:.1f} min")
          # docs/03-api-spec.md Plausibilitaet Vaduz->Schaan: ~3-6 km / 5-12 min;
          # hier gelockert, damit ein alternativer (aber plausibler) Routing-
          # Umweg den Job nicht flaky macht.
          assert 2.0 <= km <= 8.0, f"Distanz {km} km ausserhalb des plausiblen Bereichs"
          assert 3.0 <= minutes <= 20.0, f"Dauer {minutes} min ausserhalb des plausiblen Bereichs"
          print("PLAUSIBEL - echtes Routing auf dem LI-Strassennetz")
          PY

      - name: Dump Valhalla logs on failure
        if: failure()
        run: docker logs valhalla 2>&1 | tail -150 || true

  golden-routes-li:
    name: Golden-Routes LI (safety gate, Merge-Blocker)
    runs-on: ubuntu-latest
    # 🔴 Merge-Blocker ab Gate G2 (docs/07 §3b, E03-T5). Independent, self-
    # contained gate: builds the LI Valhalla graph (gis-ops recipe, same as
    # valhalla-li-build), starts the CORE against it, and runs the Golden-Route
    # runner (GOLDEN_REGION=li). Talking to the Core -- not Valhalla directly --
    # means the profile->truck-costing mapping (W-08) is under test too. This is
    # also the "echte-LI-Integration" gate left open by E03-T2.
    # NO retry (vitest.golden.config.ts: retry:0, bail:1) -- a failed safety/
    # monotonic case HARD-ABORTS with no retry and no tolerance.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-safety for the runner itself: e2e/ is not a workspace package, so
      # `pnpm typecheck` (which is `pnpm -r`) does not cover it. Check it here.
      - name: Typecheck golden-routes runner
        run: pnpm exec tsc --noEmit -p e2e/golden-routes/tsconfig.json

      # Build the LI graph exactly like valhalla-li-build (gis-ops image,
      # atomic swap, W-17), then serve it on :8002 the way docker-compose does.
      - name: Build Liechtenstein tileset via build-tiles.sh
        run: |
          chmod +x services/valhalla/build-tiles.sh
          services/valhalla/build-tiles.sh https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf

      - name: Start Valhalla serving the swapped tiles
        run: |
          docker run -d --name valhalla \
            -p 8002:8002 \
            -v "$PWD/data/valhalla/tiles:/custom_files" \
            -e tile_urls= \
            -e serve_tiles=True \
            -e force_rebuild=False \
            -e build_elevation=False \
            -e build_admins=True \
            -e build_time_zones=False \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest

      - name: Wait for Valhalla /status
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8002/status >/dev/null 2>&1; then
              echo "Valhalla /status ready after ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Valhalla did not come up in time"
              docker logs valhalla 2>&1 | tail -150
              exit 1
            fi
            sleep 2
          done

      # Build the app so apps/core/dist exists (same `pnpm build` the docker
      # job uses). The runner drives the built Core over HTTP.
      - name: Build app
        run: pnpm build

      # Start the Core against the live LI Valhalla and run the LI golden set.
      # DB_PATH=:memory: keeps the run stateless (the profiles the runner
      # creates live in the same long-running process). TILES_DIR is left at
      # its default (no PMTiles installed) so the coverage check is a no-op and
      # routing is exercised end-to-end. Core lifecycle stays inside this step
      # for reliability. GOLDEN_LIVE=1 switches on the route assertions.
      - name: Run Golden-Routes runner (GOLDEN_REGION=li)
        run: |
          DB_PATH=:memory: VALHALLA_URL=http://localhost:8002 PORT=8080 \
            node apps/core/dist/index.js > core.log 2>&1 &
          CORE_PID=$!
          echo "Core started (pid $CORE_PID); waiting for health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "Core healthy after ~${i}s"
              break
            fi
            if ! kill -0 "$CORE_PID" 2>/dev/null; then
              echo "::error::Core process exited before becoming healthy"
              cat core.log
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Core did not become healthy in time"
              cat core.log
              exit 1
            fi
            sleep 1
          done
          set +e
          GOLDEN_LIVE=1 GOLDEN_REGION=li CORE_URL=http://localhost:8080 pnpm golden-routes
          RC=$?
          set -e
          kill "$CORE_PID" 2>/dev/null || true
          exit $RC

      - name: Dump Core log on failure
        if: failure()
        run: tail -200 core.log || true

      - name: Dump Valhalla logs on failure
        if: failure()
        run: docker logs valhalla 2>&1 | tail -150 || true

  lite-search-li-build:
    name: Lite-Suchindex LI Build & Smoke (E05-T5, W-12)
    runs-on: ubuntu-latest
    # Bewusst KEIN `needs: quality` -- mirrors `valhalla-li-build`'s reasoning:
    # eigenstaendige Daten-Pipeline (E05-T5), rührt keinen App-Code auf eine
    # Weise an, die von `quality` bereits abgedeckt waere. Der LI-PBF ist
    # winzig, daher als eigener per-PR-Gate-Job tragbar statt nur nightly.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # osmium-tool does the actual PBF parsing (tags-filter + export to
      # GeoJSONSeq) -- see build-lite-index.sh's header comment for why this
      # split (battle-tested C++ tool for the PBF format itself, pure/
      # unit-tested TypeScript for everything downstream).
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - name: Download Liechtenstein PBF (Geofabrik)
        run: curl -fL -o li.osm.pbf https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf

      # Exercises build-lite-index.sh end-to-end: osmium tags-filter + export,
      # tsx CLI (extract.ts/buildIndex.ts), atomic temp-file+rename swap
      # (W-17). Beweist Akzeptanz #1 ("LI-Lite-Index baut in CI < 1 min").
      - name: Build LI lite_search.db via build-lite-index.sh (timed, atomic swap)
        run: |
          chmod +x services/valhalla/build-lite-index.sh
          time services/valhalla/build-lite-index.sh li.osm.pbf

      - name: Verify the index file exists and is non-trivial in size
        run: |
          DB_PATH="data/lite-search/lite_search.db"
          test -s "$DB_PATH" || { echo "::error::$DB_PATH fehlt oder ist leer"; exit 1; }
          ls -la "$DB_PATH"

      # Beweist Akzeptanz #1 ("findet 'Vaduz' und eine Strasse") direkt gegen
      # die gebaute SQLite-Datei -- unabhaengig von apps/core, damit dieser
      # Job auch isoliert aussagekraeftig bleibt (der volle Backend-Pfad ist
      # bereits durch apps/core/src/search/lite/liteBackend.test.ts abgedeckt).
      - name: Smoke - "Vaduz" (city) and at least one street are findable via FTS5 trigram MATCH
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/lite-search/lite_search.db")
          cur = con.cursor()

          cur.execute(
              "SELECT p.name, p.kind FROM lite_search "
              "JOIN places p ON p.id = lite_search.rowid "
              "WHERE lite_search MATCH ? ORDER BY bm25(lite_search) LIMIT 20",
              ('"Vadu"',),
          )
          rows = cur.fetchall()
          print("Treffer fuer 'Vadu':", rows)
          names = [r[0] for r in rows]
          kinds_by_name = {r[0]: r[1] for r in rows}
          assert "Vaduz" in names, "Vaduz nicht gefunden"
          # Akzeptanz #1 verlangt nur, dass Vaduz GEFUNDEN wird -- der genaue
          # kind haengt an OSMs Tagging (Vaduz ist als kleine Hauptstadt real
          # place=town oder place=city, je nach Datenstand); wir asserten daher
          # nur, dass es als ORT (nicht als Strasse) im Index landet. Die
          # kind-Rangfolge (city>town>village>street) ist separat in
          # ranking.test.ts gegen synthetische Daten bewiesen.
          assert kinds_by_name["Vaduz"] in ("city", "town", "village"), (
              f"Vaduz hat unerwarteten kind: {kinds_by_name['Vaduz']}"
          )

          cur.execute("SELECT COUNT(*) FROM places WHERE kind = 'street'")
          street_count = cur.fetchone()[0]
          print("Anzahl Strassen im Index:", street_count)
          assert street_count >= 1, "keine einzige Strasse im Index gefunden"

          cur.execute("SELECT COUNT(*) FROM places WHERE kind IN ('city','town','village')")
          place_count = cur.fetchone()[0]
          print("Anzahl Orte im Index:", place_count)
          assert place_count >= 1, "keine Orte im Index gefunden"

          print("PLAUSIBEL - Lite-Suchindex enthaelt Vaduz (city) und mindestens eine Strasse")
          PY

      - name: Index size (informational -- docs/07 acceptance #3 "DE < 400 MB" is a nightly/DE-scale claim, not asserted here for the tiny LI extract)
        run: du -h data/lite-search/lite_search.db

      - name: Show build-lite-index.sh output on failure
        if: failure()
        run: echo "Siehe vorherige Schritte fuer osmium/tsx-Ausgabe."

  photon-setup:
    name: Photon Setup — Skript-Fixtures & Xmx-Wiring (E05-T4)
    runs-on: ubuntu-latest
    # Bewusst KEIN `needs: quality` -- eigenstaendige Daten-/Infra-Pipeline
    # (E05-T4), mirrors valhalla-li-build/lite-search-li-build's Begruendung.
    #
    # WICHTIG (volle Recherche in services/photon/README.md "Warum kein
    # LI-only-Index in CI"): weder komoot/photons eigene Dumps
    # (https://download1.graphhopper.com/public, nur "planet" + eine kleine
    # Liste GROSSER Laender) noch der von docker-compose.yml genutzte
    # rtuszik/photon-docker-Spiegel (BASE_URL https://r2.koalasec.org/public,
    # exakt 16 fest vorgegebene Laender -- Liechtenstein NICHT darunter, nur
    # als Teil von "switzerland-liechtenstein", und dort nur als
    # experimentelles JSONL-Dump statt als fertiger Such-Index) bieten einen
    # Liechtenstein-GROSSEN, schnellen, per-PR-tauglichen Photon-Index. Einen
    # Photon-Index aus einer rohen OSM-PBF selbst zu bauen braucht offiziell
    # eine volle Nominatim-Postgres-Importpipeline (schwergewichtig, fuer
    # einen schnellen per-PR-Gate nicht angemessen -- anders als Valhalla/den
    # Lite-Suchindex, die direkt aus einer PBF bauen).
    #
    # Deshalb prueft DIESER Job alles, was OHNE echte Geodaten belegbar ist:
    # Skript-Logik (Resume+Checksumme, Akzeptanz #3), Compose-Config
    # (JAVA_PARAMS-Interpolation, Healthcheck-Wiring), und die tatsaechliche
    # Xmx-Wirkung auf die im Image gebuendelte JVM (Akzeptanz #2). Der echte
    # "Vaduz"-Suchtest gegen ein LEBENDES Photon (Akzeptanz #1, E05-T1-
    # SearchService-Integration) laeuft NIGHTLY (.github/workflows/nightly.yml
    # Job `photon-li-nightly`, analog zu den "unverified" DE-Golden-Routes)
    # gegen die naechstkleinere ECHTE Region, "switzerland-liechtenstein" --
    # NICHT per-PR. "Prefer making the per-PR LI job work" wurde ernst
    # genommen (siehe README fuer die vollstaendige Abwaegung); das Ergebnis
    # dieser Recherche ist, dass es per-PR schlicht nicht sauber/schnell
    # verifizierbar geht.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Script syntax (bash -n)
        run: |
          bash -n services/photon/download-index.sh
          bash -n services/photon/download-index.test.sh

      # Beweist Akzeptanz #3 ("Download-Resume nachgewiesen") + den
      # Pflicht-Test "Skript-Test mit Abbruch-Fixture" -- komplett offline
      # gegen einen lokalen Loopback-Server (kein echtes Netzwerk noetig,
      # laeuft daher identisch lokal wie hier in CI, siehe Kommentarkopf des
      # Testskripts fuer die genaue Grenze dieser Aussage).
      - name: download-index.sh fixture test (resume + checksum, local loopback)
        run: |
          chmod +x services/photon/download-index.sh services/photon/download-index.test.sh
          services/photon/download-index.test.sh

      # docker-compose.yml's `core`-Service referenziert `env_file: - .env`,
      # das (wie in .gitignore) in einem frischen Checkout nicht existiert --
      # `docker compose config` bricht sonst hart ab. .env.example ist exakt
      # dafuer da.
      - name: docker compose config validates (JAVA_PARAMS interpolation, healthcheck wiring)
        run: |
          cp .env.example .env
          PHOTON_XMX=777m docker compose --profile search config | tee compose-config.yml
          grep -q -- '-Xmx777m' compose-config.yml || { echo "::error::JAVA_PARAMS=-Xmx\${PHOTON_XMX} wurde nicht wie erwartet in die aufgeloeste Compose-Config interpoliert"; exit 1; }
          grep -q '2322' compose-config.yml
          grep -q '/status' compose-config.yml
          echo "PLAUSIBEL - Compose-Config loest photon-Service inkl. Xmx-Env und /status-Healthcheck korrekt auf."

      - name: Pull rtuszik/photon-docker image
        run: docker pull rtuszik/photon-docker:latest

      # Beweist Akzeptanz #2 ("Xmx wirkt, Container-Limit-Test") DIREKT gegen
      # die im Image gebuendelte JVM -- unabhaengig davon, ob Photons eigener
      # Python-Entrypoint mit einem (hier absichtlich leeren) Index ueberhaupt
      # bis zum Ready-Zustand hochkommt (siehe naechster Schritt fuer diesen
      # separaten, informativen Teil). `-XX:+PrintFlagsFinal` zeigt den
      # EFFEKTIVEN Heap-Wert, den die JVM tatsaechlich anwendet, nicht nur die
      # uebergebene Flag-Syntax.
      - name: Xmx effective — direct JVM proof (container-limit test)
        run: |
          set -e
          check_xmx() {
            xmx_flag="$1"; expected_mb="$2"
            out=$(docker run --rm --entrypoint sh rtuszik/photon-docker:latest -c \
              "java -Xmx${xmx_flag} -XX:+PrintFlagsFinal -version 2>&1 | grep -iE '\bMaxHeapSize\b'")
            echo "JAVA_PARAMS=-Xmx${xmx_flag} -> $out"
            actual_bytes=$(echo "$out" | grep -oE '[0-9]+' | head -n1)
            expected_bytes=$((expected_mb * 1024 * 1024))
            low=$((expected_bytes * 90 / 100))
            high=$((expected_bytes * 110 / 100))
            if [ -z "$actual_bytes" ] || [ "$actual_bytes" -lt "$low" ] || [ "$actual_bytes" -gt "$high" ]; then
              echo "::error::-Xmx${xmx_flag} sollte ~${expected_bytes} Bytes MaxHeapSize ergeben (+-10%), tatsaechlich: '${actual_bytes:-<leer>}'"
              exit 1
            fi
            echo "OK: MaxHeapSize=$actual_bytes liegt innerhalb +-10% von $expected_bytes (-Xmx${xmx_flag})"
          }
          check_xmx 256m 256
          check_xmx 1g 1024

      # Zusaetzlicher, INFORMATIVER Beleg: derselbe Xmx-Wert kommt auch ueber
      # den echten docker-compose-Pfad (JAVA_PARAMS-Env) im Container an.
      # Ohne echten Index ist unklar, ob/wann Photons Python-Entrypoint die
      # JVM tatsaechlich startet (README) -- dieser Schritt blockiert den Job
      # daher NICHT auf einem gesunden /status, sondern nur auf der
      # Env-Weitergabe selbst.
      - name: Compose bring-up smoke (env wiring; no real geodata, tolerant of degraded status)
        run: |
          PHOTON_XMX=256m docker compose --profile search up -d photon
          sleep 10
          echo "-- Container-Status --"
          docker inspect --format '{{.State.Status}}' yapaja-photon
          echo "-- Env (JAVA_PARAMS muss ankommen) --"
          docker inspect --format '{{.Config.Env}}' yapaja-photon | tee env.out
          grep -q 'JAVA_PARAMS=-Xmx256m' env.out || { echo "::error::JAVA_PARAMS kam nicht wie erwartet im Container an"; exit 1; }
          echo "-- /status (informativ -- ohne echten Index ist ein Nicht-200 hier erwartet und OK, siehe README) --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:2322/status || echo "kein Connect (ebenfalls moeglich ohne Index -- rein informativ)"
          docker logs yapaja-photon 2>&1 | tail -60
          docker compose --profile search down

      - name: Dump Photon logs on failure
        if: failure()
        run: docker logs yapaja-photon 2>&1 | tail -150 || true

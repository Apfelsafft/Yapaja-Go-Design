# ─── Yapaia Go auf dem ESP32-2424S012 ───────────────────────────────────────
#
# Ein Navigationsinstrument fuer das Armaturenbrett: naechstes Manoever mit
# Pfeil und Entfernung, Tempo gegen Tempolimit, Ankunftszeit.
#
# Gebaut fuer das **ESP32-2424S012** — das runde 1,28-Zoll-Modul mit 240x240
# Bildpunkten. Wichtig, weil oft anders angenommen: darauf sitzt ein
# **ESP32-C3** (RISC-V, 400 KB RAM, KEIN PSRAM), nicht ein S3. Der Anzeige-
# treiber ist ein GC9A01A an SPI; ESPHome kennt ihn seit Laengerem unter
# `ili9xxx`/`GC9A01A`, eine externe Komponente braucht es NICHT mehr (viele
# Forenbeitraege sagen noch etwas anderes).
#
# ─── WAS HIER NICHT STEHT, UND WARUM ────────────────────────────────────────
# Die KARTE. Yapaias Karte ist MapLibre: Vektorkacheln (PMTiles), die ein
# Browser per WebGL zeichnet. Ein ESP32 hat keinen Browser und ESPHome keinen
# Kartenrenderer.
#
# Bilder KANN ESPHome anzeigen (`online_image`), aber auf diesem Board zweimal
# nicht: es gibt keinen Endpunkt, der die Karte als Rasterbild ausliefert, und
# `online_image` braucht PSRAM, das der C3 nicht hat. Siehe README.md daneben.
#
# Auf 240 runden Bildpunkten, aus zwei Metern im fahrenden Fahrzeug, sagt ein
# grosser Pfeil ohnehin mehr als eine Karte.
#
# ─── WORAUS DIE WERTE KOMMEN ────────────────────────────────────────────────
# Aus Home Assistant, ueber die native ESPHome-API. Yapaia schreibt dieselben
# Entity-IDs auf BEIDEN Wegen — direkt (`ha_internal`) und ueber MQTT —, also
# passt diese Datei zu beiden Betriebsarten ohne Aenderung.
#
# WLAN-Zugangsdaten stehen in `secrets.yaml`, nicht hier.

substitutions:
  geraetename: yapaja-nav-display
  anzeigename: "Yapaia Navigationsanzeige"

  # ─── DIE ZEITZONE ─────────────────────────────────────────────────────────
  # Wird gebraucht, nicht nur der Ordnung halber: Yapaia liefert die
  # Ankunftszeit als ISO-8601 in UTC (`…Z`, der Core rechnet durchgaengig in
  # UTC, W-22). Ohne richtige Zeitzone zeigt die Anzeige im Sommer zwei
  # Stunden zu frueh — ohne jede Fehlermeldung, und das ist die schlimmste
  # Sorte Fehler.
  zeitzone: Europe/Berlin

  # ─── RUNDES ODER ECKIGES PANEL ────────────────────────────────────────────
  # `true` haelt die ganze Zeichnung im eingeschriebenen Kreis. Auf einem
  # runden Glas sind die Ecken schlicht nicht da; was dort steht, ist weg.
  # Fuer ein eckiges Panel auf `false` — dann wird die volle Breite genutzt.
  rund: "true"

  # ─── PINS DES ESP32-2424S012 ──────────────────────────────────────────────
  # Fuer ein anderes Board anpassen; README.md nennt die gaengigen.
  pin_sck: GPIO6
  pin_mosi: GPIO7
  pin_cs: GPIO10
  pin_dc: GPIO2
  pin_backlight: GPIO3

esphome:
  name: ${geraetename}
  friendly_name: ${anzeigename}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # `INFO` statt `DEBUG`: auf `DEBUG` protokolliert die API jede eingehende
  # Zustandsaenderung, und Yapaia schickt im Sekundentakt. Auf dem C3 kostet
  # das ausserdem Arbeitsspeicher, von dem es hier wenig gibt.
  level: INFO
  # Der C3 hat keinen USB-UART-Bruecke-Chip, sondern USB-Serial-JTAG direkt.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret yapaja_display_api_key

ota:
  - platform: esphome
    password: !secret yapaja_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Im Fahrzeug faellt das WLAN oefter aus als daheim. Der Zugangspunkt ist
  # die Rueckfalltuer, um das Geraet ohne Werkstattbesuch neu einzurichten.
  ap:
    ssid: "${geraetename} Fallback"

captive_portal:

# ─── ZEIT ───────────────────────────────────────────────────────────────────
# Liefert die Uhrzeit UND die Zeitzone, ohne die `ESPTime::from_epoch_local()`
# unten nichts umzurechnen haette.
time:
  - platform: homeassistant
    id: ha_zeit
    timezone: ${zeitzone}

# ─── DIE WERTE AUS YAPAIA ───────────────────────────────────────────────────
# Alle ohne `name:`, damit sie NICHT als neue Entitaeten nach Home Assistant
# zurueckgemeldet werden. Sie kommen von dort; sie dort noch einmal anzulegen
# waere ein zweiter Satz Entitaeten mit denselben Werten.
sensor:
  - platform: homeassistant
    id: yapaja_tempo
    entity_id: sensor.yapaja_speed
  - platform: homeassistant
    id: yapaja_tempolimit
    entity_id: sensor.yapaja_speed_limit
  - platform: homeassistant
    id: yapaja_manoever_entfernung
    entity_id: sensor.yapaja_instruction_distance

binary_sensor:
  - platform: homeassistant
    id: yapaja_zu_schnell
    entity_id: binary_sensor.yapaja_speeding

text_sensor:
  # Der Anweisungstext, bereits auf Deutsch formuliert ("Links abbiegen auf B27").
  - platform: homeassistant
    id: yapaja_anweisung
    entity_id: sensor.yapaja_instruction
  # Die Art des Manoevers — daraus wird der Pfeil. Steht im Attribut, nicht
  # im Zustand.
  - platform: homeassistant
    id: yapaja_manoever_art
    entity_id: sensor.yapaja_instruction
    attribute: type
  # idle | routing | navigating | paused | arrived | off_route
  - platform: homeassistant
    id: yapaja_fahrzustand
    entity_id: sensor.yapaja_nav_state
  # ISO 8601 in UTC. Wird unten umgerechnet, nicht abgeschnitten.
  - platform: homeassistant
    id: yapaja_ankunft
    entity_id: sensor.yapaja_eta

# ─── HINTERGRUNDBELEUCHTUNG ─────────────────────────────────────────────────
# Als Licht ausgefuehrt, damit Home Assistant sie dimmen kann — nachts im
# Fahrerhaus ist ein Display auf voller Helligkeit blendend.
output:
  - platform: ledc
    pin: ${pin_backlight}
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Helligkeit"
    id: backlight
    restore_mode: ALWAYS_ON

color:
  - id: c_hintergrund
    hex: "0B0F14"
  - id: c_text
    hex: "F2F5F7"
  - id: c_gedaempft
    hex: "8A949E"
  - id: c_pfeil
    hex: "4EA1FF"
  - id: c_warnung
    hex: "FF4D4D"
  - id: c_gut
    hex: "3DDC84"
  - id: c_schild
    hex: "FFFFFF"

# ─── SCHRIFTEN ──────────────────────────────────────────────────────────────
# `glyphs` ausdruecklich gesetzt: die Vorgabe von ESPHome kennt kein ä, ö, ü
# oder ß. Deutsche Strassennamen bestehen zu einem guten Teil daraus, und ein
# fehlendes Zeichen wird stillschweigend ausgelassen — aus "Grünstraße" wird
# "Grnstrae", ohne Warnung.
#
# Kleiner als auf einem eckigen Panel: 240 runde Bildpunkte sind wenig, und
# jede Schriftgroesse kostet auf dem C3 zusaetzlich Arbeitsspeicher.
font:
  - file: "gfonts://Roboto@700"
    id: font_xl
    size: 40
    glyphs: &zeichen "!\"%()+=,-_.:/°'’ 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß"
  - file: "gfonts://Roboto@700"
    id: font_l
    size: 26
    glyphs: *zeichen
  - file: "gfonts://Roboto@500"
    id: font_m
    size: 18
    glyphs: *zeichen
  - file: "gfonts://Roboto@400"
    id: font_s
    size: 13
    glyphs: *zeichen

spi:
  clk_pin: ${pin_sck}
  mosi_pin: ${pin_mosi}

display:
  - platform: ili9xxx
    model: GC9A01A
    id: anzeige
    cs_pin: ${pin_cs}
    dc_pin: ${pin_dc}
    # KEIN `reset_pin`: auf dem ESP32-2424S012 ist RESET des Panels nicht auf
    # einen GPIO gefuehrt. Einen anzugeben, der nicht verdrahtet ist, laesst
    # das Display schwarz — der haeufigste Stolperstein bei diesem Board.
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    # Yapaia meldet im Sekundentakt; 500 ms zeichnen ist fluessig genug und
    # laesst dem Funk Luft. Auf dem C3 ist beides knapp.
    update_interval: 500ms
    lambda: |-
      // ══ Der Kreis ══════════════════════════════════════════════════════
      // Auf einem runden Glas sind die Ecken nicht da. Was dort gezeichnet
      // wird, ist nicht "abgeschnitten" -- es ist weg, ohne dass am Geraet
      // etwas darauf hindeutet. Deshalb rechnet die ganze Aufteilung unten
      // mit der HALBBREITE AUF HOEHE y statt mit der Bildbreite.
      const int B = it.get_width();
      const int H = it.get_height();
      const int cx = B / 2;
      const int cy = H / 2;
      const bool rund = ${rund};
      // 8 Bildpunkte Rand: die Fassung des Moduls verdeckt den aeussersten
      // Ring, und Buchstaben genau auf der Kante sind schlecht zu lesen.
      const int r = (rund ? std::min(B, H) / 2 : std::min(B, H) / 2) - 8;

      auto halbbreite = [&](int y) -> int {
        if (!rund) return B / 2 - 6;
        const int dy = y - cy;
        const int q = r * r - dy * dy;
        return q <= 0 ? 0 : (int) std::sqrt((double) q);
      };

      it.fill(id(c_hintergrund));

      // Ist ein Wert ueberhaupt da? Home Assistant schickt fuer "weiss ich
      // nicht" NaN, und `NaN` ungeprueft zu drucken ergibt nicht "nan",
      // sondern "-2147483648".
      //
      // Als REFERENZ, nicht als Zeiger: `id(...)` liefert in ESPHome das
      // Objekt selbst -- daher auch die Punktschreibweise `id(x).state`.
      auto hat = [](esphome::sensor::Sensor &s) {
        return s.has_state() && !std::isnan(s.state);
      };

      // ══ Fahrzustand ════════════════════════════════════════════════════
      const std::string zustand = id(yapaja_fahrzustand).state;
      if (zustand != "navigating") {
        const char *text = "Keine Route";
        if (zustand == "routing")   text = "Route wird berechnet";
        if (zustand == "paused")    text = "Pausiert";
        if (zustand == "arrived")   text = "Angekommen";
        if (zustand == "off_route") text = "Abseits der Route";
        if (zustand.empty() || zustand == "unavailable") text = "Keine Verbindung";
        it.print(cx, cy, id(font_m), id(c_gedaempft), TextAlign::CENTER, text);
        return;
      }

      // ══ Oben: der Anweisungstext ═══════════════════════════════════════
      // Gekuerzt nach ZEICHENZAHL, geschaetzt aus der verfuegbaren Breite.
      // Das ist eine Schaetzung und als solche gemeint: die tatsaechliche
      // Breite einer Zeichenkette kennt nur die Schrift. Lieber ein Wort zu
      // frueh abgeschnitten als eines, das im Rund verschwindet.
      const int ty = cy - (r * 62) / 100;
      const int platz = (halbbreite(ty) * 2) / 7;   // ~7 Bildpunkte je Zeichen
      std::string anweisung = id(yapaja_anweisung).state;
      if (anweisung == "unknown" || anweisung == "unavailable") anweisung.clear();
      if (platz > 1 && (int) anweisung.size() > platz) {
        // ─── NICHT MITTEN IN EIN ZEICHEN SCHNEIDEN ──────────────────────
        // `std::string` zaehlt BYTES. „ß", „ü", „ä" sind in UTF-8 zwei Bytes
        // lang, und deutsche Strassennamen bestehen zu einem guten Teil
        // daraus. Faellt der Schnitt zwischen die beiden Bytes, entsteht
        // kein Zeichen, sondern Bruch -- die Schrift zeigt dann ein
        // Ersatzkaestchen oder gar nichts, mitten im Strassennamen.
        //
        // Also zurueck bis zum Anfang des Zeichens: Folgebytes eines
        // UTF-8-Zeichens haben immer das Bitmuster 10xxxxxx.
        size_t schnitt = (size_t) platz - 1;
        while (schnitt > 0 && ((unsigned char) anweisung[schnitt] & 0xC0) == 0x80) {
          schnitt--;
        }
        anweisung = anweisung.substr(0, schnitt) + "…";
      }
      it.print(cx, ty, id(font_s), id(c_gedaempft), TextAlign::CENTER, anweisung.c_str());

      // ══ Mitte: der Manoeverpfeil ═══════════════════════════════════════
      // Gezeichnet, nicht als Symbolschrift geladen: so haengt die Anzeige
      // an keiner Schriftdatei und keinen Zeichen-Nummern, die beim
      // naechsten Aktualisieren der Schrift verrutschen koennen -- und auf
      // dem C3 spart es den Speicher einer weiteren Schrift.
      //
      // Eingeordnet wird ueber Teilzeichenketten. `ManeuverType` ist in
      // `packages/shared/src/types.ts` ausdruecklich `| string` -- Valhalla
      // liefert auch `slight_left`, `sharp_right`, `ramp_left`, `merge` und
      // anderes. Wer auf genaue Gleichheit prueft, bekommt bei jedem dieser
      // Werte den Geradeaus-Pfeil, also die falsche Richtung.
      const std::string art = id(yapaja_manoever_art).state;
      auto enthaelt = [&](const char *teil) {
        return art.find(teil) != std::string::npos;
      };

      const int py = cy - (r * 20) / 100;
      // Die Kantenlaenge kommt aus `r`, also aus der KLEINEREN Seite. Damit
      // passt der Pfeil in jedem Seitenverhaeltnis; eine zusaetzliche
      // Begrenzung auf die Halbbreite stand hier zunaechst, konnte aber nie
      // greifen -- der Prueflauf zeigte, dass sie sich entfernen laesst, ohne
      // dass ein Fall anders ausgeht. Beiwerk, das Sicherheit nur vortaeuscht.
      const int s = (r * 30) / 100;
      const int d = s / 3;
      auto C = id(c_pfeil);

      if (enthaelt("uturn")) {
        const int seite = enthaelt("uturn_right") ? 1 : -1;
        it.filled_rectangle(cx - d / 2, py - s / 3, d, s + s / 3, C);
        it.filled_rectangle(cx - d / 2, py - s, d + seite * s, d, C);
        const int ex = cx + seite * s;
        it.filled_rectangle(ex - d / 2, py - s, d, s / 2, C);
        it.filled_triangle(ex - s / 2, py - s / 2, ex + s / 2, py - s / 2, ex, py + s / 4, C);
      } else if (enthaelt("roundabout")) {
        it.filled_ring(cx, py, (s * 2) / 3, (s * 2) / 5, C);
        it.filled_rectangle(cx - d / 2, py, d, s, C);
        const int seite = enthaelt("left") ? -1 : 1;
        const int ax = cx + (seite * s * 2) / 3;
        it.filled_rectangle(cx, py - (s * 2) / 3 - d / 2, (seite * s * 2) / 3, d, C);
        it.filled_triangle(ax, py - s, ax, py - s / 3, ax + seite * s / 2, py - (s * 2) / 3, C);
      } else if (enthaelt("left") || enthaelt("right")) {
        const int seite = enthaelt("right") ? 1 : -1;
        it.filled_rectangle(cx - d / 2, py, d, s, C);
        it.filled_rectangle(cx - d / 2, py, (seite * s * 2) / 3, d, C);
        const int ex = cx + (seite * s * 2) / 3;
        it.filled_triangle(ex, py - s / 2, ex, py + s / 2 + d, ex + seite * s / 2, py + d / 2, C);
      } else {
        // Geradeaus -- und alles, was wir nicht einordnen koennen. Ein Pfeil
        // nach vorn ist bei `merge`, `continue` oder `destination` nicht
        // falsch; gar nichts zu zeichnen waere schlechter.
        it.filled_rectangle(cx - d / 2, py - s / 3, d, s + s / 3, C);
        it.filled_triangle(cx - s / 2, py - s / 3, cx + s / 2, py - s / 3, cx, py - s, C);
      }

      // ══ Darunter: die Entfernung, gross ════════════════════════════════
      // Unter 1000 m in Metern, darueber in Kilometern. Auf 10 m gerundet:
      // "483 m" taeuscht eine Genauigkeit vor, die GPS nicht hat, und die
      // letzte Ziffer flackerte im Sekundentakt.
      const int dy_ = cy + (r * 28) / 100;
      if (hat(id(yapaja_manoever_entfernung))) {
        const float m = id(yapaja_manoever_entfernung).state;
        if (m >= 1000.0f) {
          it.printf(cx, dy_, id(font_xl), id(c_text), TextAlign::CENTER, "%.1f km", m / 1000.0f);
        } else {
          it.printf(cx, dy_, id(font_xl), id(c_text), TextAlign::CENTER,
                    "%d m", ((int) (m / 10.0f + 0.5f)) * 10);
        }
      } else {
        it.print(cx, dy_, id(font_xl), id(c_gedaempft), TextAlign::CENTER, "--");
      }

      // ══ Unten: Tempo · Tempolimit · Ankunft ════════════════════════════
      const int uy = cy + (r * 68) / 100;
      const int hb = halbbreite(uy);

      const bool zu_schnell = id(yapaja_zu_schnell).state;
      if (hat(id(yapaja_tempo))) {
        it.printf(cx - hb + 2, uy, id(font_l),
                  zu_schnell ? id(c_warnung) : id(c_text), TextAlign::CENTER_LEFT,
                  "%d", (int) (id(yapaja_tempo).state + 0.5f));
      }

      // Weisser Ring mit rotem Rand, wie das Verkehrszeichen. NUR wenn die
      // Karte eines kennt -- ein leeres oder auf 0 stehendes Schild waere die
      // Behauptung, hier gelte Tempo 0.
      if (hat(id(yapaja_tempolimit))) {
        const int sr = std::min(15, r / 7);
        it.filled_circle(cx, uy, sr, id(c_warnung));
        it.filled_circle(cx, uy, (sr * 72) / 100, id(c_schild));
        it.printf(cx, uy, id(font_s), id(c_hintergrund), TextAlign::CENTER,
                  "%d", (int) (id(yapaja_tempolimit).state + 0.5f));
      }

      // Yapaia liefert die Ankunft als ISO 8601 in UTC. Hier wird sie
      // GERECHNET, nicht abgeschnitten: `14:32Z` ist in Deutschland 16:32,
      // im Winter 15:32. Ein `substr(11, 5)` waere kuerzer und im Sommer
      // zwei Stunden falsch.
      const std::string iso = id(yapaja_ankunft).state;
      int Y, Mo, D, h, mi, se;
      if (sscanf(iso.c_str(), "%4d-%2d-%2dT%2d:%2d:%2d", &Y, &Mo, &D, &h, &mi, &se) == 6) {
        esphome::ESPTime t{};
        t.year = Y; t.month = Mo; t.day_of_month = D;
        t.hour = h; t.minute = mi; t.second = se;
        // `false`: die Nummer des Tages im Jahr ist oben nicht gesetzt,
        // gerechnet wird aus dem Datum.
        t.recalc_timestamp_utc(false);
        auto lokal = esphome::ESPTime::from_epoch_local(t.timestamp);
        it.printf(cx + hb - 2, uy, id(font_m), id(c_gut), TextAlign::CENTER_RIGHT,
                  "%02d:%02d", lokal.hour, lokal.minute);
      } else {
        // "unknown", "unavailable" oder leer -- dann steht hier nichts
        // Erfundenes.
        it.print(cx + hb - 2, uy, id(font_m), id(c_gedaempft), TextAlign::CENTER_RIGHT, "--:--");
      }

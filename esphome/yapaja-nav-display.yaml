# ─── Yapaia Go auf dem ESP32-2424S012 ───────────────────────────────────────
#
# Ein Navigationsinstrument fuer das Armaturenbrett: naechstes Manoever mit
# Pfeil und Entfernung, Tempo gegen Tempolimit, Ankunftszeit.
#
# Gebaut fuer das **ESP32-2424S012** — das runde 1,28-Zoll-Modul mit 240x240
# Bildpunkten. Wichtig, weil oft anders angenommen: darauf sitzt ein
# **ESP32-C3** (RISC-V, 400 KB RAM, KEIN PSRAM), nicht ein S3. Der Anzeige-
# treiber ist ein GC9A01A an SPI; ESPHome kennt ihn seit Laengerem unter
# `ili9xxx`/`GC9A01A`, eine externe Komponente braucht es NICHT mehr (viele
# Forenbeitraege sagen noch etwas anderes).
#
# ─── WAS HIER NICHT STEHT, UND WARUM ────────────────────────────────────────
# Die KARTE. Yapaias Karte ist MapLibre: Vektorkacheln (PMTiles), die ein
# Browser per WebGL zeichnet. Ein ESP32 hat keinen Browser und ESPHome keinen
# Kartenrenderer.
#
# Bilder KANN ESPHome anzeigen (`online_image`), aber auf diesem Board zweimal
# nicht: es gibt keinen Endpunkt, der die Karte als Rasterbild ausliefert, und
# `online_image` braucht PSRAM, das der C3 nicht hat. Siehe README.md daneben.
#
# Auf 240 runden Bildpunkten, aus zwei Metern im fahrenden Fahrzeug, sagt ein
# grosser Pfeil ohnehin mehr als eine Karte.
#
# ─── WORAUS DIE WERTE KOMMEN ────────────────────────────────────────────────
# Aus Home Assistant, ueber die native ESPHome-API. Yapaia schreibt dieselben
# Entity-IDs auf BEIDEN Wegen — direkt (`ha_internal`) und ueber MQTT —, also
# passt diese Datei zu beiden Betriebsarten ohne Aenderung.
#
# WLAN-Zugangsdaten stehen in `secrets.yaml`, nicht hier.

substitutions:
  # ─── DER GERAETENAME ──────────────────────────────────────────────────────
  # Das ist der Name, unter dem ESPHome das Geraet fuehrt -- und damit auch
  # sein Hostname im Netz (`navi.local`) und der Name der Rueckfall-SSID.
  #
  # Kleinbuchstaben, Ziffern und Bindestriche; ESPHome laesst nichts anderes
  # zu, weil daraus ein Hostname wird.
  #
  # ─── ER HAENGT MIT DEM SCHLUESSELNAMEN ZUSAMMEN ───────────────────────────
  # Der API-Schluessel steht als `!secret navi__api_key` in der `secrets.yaml`
  # (siehe unten bei `api:`). Der Device Builder benennt solche Eintraege nach
  # dem GERAET. Wer den Namen hier aendert, sollte deshalb pruefen, ob der
  # Eintrag in der `secrets.yaml` noch passt -- ESPHome merkt es nicht, es
  # sucht schlicht nach dem Namen, der in der `key:`-Zeile steht.
  geraetename: navi
  anzeigename: "Yapaia Navigationsanzeige"

  # ─── DIE ZEITZONE ─────────────────────────────────────────────────────────
  # Wird gebraucht, nicht nur der Ordnung halber: Yapaia liefert die
  # Ankunftszeit als ISO-8601 in UTC (`…Z`, der Core rechnet durchgaengig in
  # UTC, W-22). Ohne richtige Zeitzone zeigt die Anzeige im Sommer zwei
  # Stunden zu frueh — ohne jede Fehlermeldung, und das ist die schlimmste
  # Sorte Fehler.
  zeitzone: Europe/Berlin

  # ─── RUNDES ODER ECKIGES PANEL ────────────────────────────────────────────
  # `true` haelt die ganze Zeichnung im eingeschriebenen Kreis. Auf einem
  # runden Glas sind die Ecken schlicht nicht da; was dort steht, ist weg.
  # Fuer ein eckiges Panel auf `false` — dann wird die volle Breite genutzt.
  rund: "true"

  # ─── DIE ENTITAETEN AUS HOME ASSISTANT ────────────────────────────────────
  # ACHTUNG: Diese Namen stehen NICHT fest.
  #
  # Gemeldet vom Geraet: „Keine Verbindung", obwohl es in ESPHome online war.
  # Das Geraet WAR verbunden — es bekam nur keinen Wert, weil die Entitaet in
  # Home Assistant anders heisst als hier eingetragen.
  #
  # Warum das so ist, steht in `apps/core/src/ha/dashboard.ts`: Home Assistant
  # vergibt eine Entity-ID aus GERAETE- plus Entitaetsnamen, solange die
  # MQTT-Discovery kein `object_id` mitschickt. Seit 0.6.9 schickt Yapaia eines
  # mit, und dann heisst sie `sensor.yapaja_nav_state`. Aeltere Installationen
  # behalten aber ihre einmal vergebene ID — dort heisst dieselbe Entitaet
  # `sensor.yapaia_go_nav_state`. Eine Registrierung benennt nichts um.
  #
  # Genau deshalb erzeugt Yapaia sein Lovelace-Dashboard zur Laufzeit und
  # liefert es nicht fertig aus: es SIEHT NACH, wie die Entitaeten heissen.
  # Diese Datei kann das nicht — ESPHome loest die Namen beim Uebersetzen auf.
  # Also stehen sie hier an EINER Stelle, zum Nachsehen und Anpassen.
  #
  # ─── SO FINDEN SIE DIE RICHTIGEN NAMEN ────────────────────────────────────
  # In Home Assistant: Entwicklerwerkzeuge -> Zustaende -> Filter „yapa".
  # Dort stehen die echten IDs. Weicht der Anfang ab (etwa `yapaia_go_`
  # statt `yapaja_`), tragen Sie ihn unten ein und flashen neu.
  entity_praefix: sensor.yapaja
  entity_praefix_binaer: binary_sensor.yapaja

  # ─── DIE DIGITALE WASSERWAAGE ─────────────────────────────────────────────
  # Beim Parken wechselt die Anzeige auf eine runde Libelle: steht das
  # Wohnmobil gerade? Alles, was dafuer einzustellen ist, steht HIER -- die
  # Entitaeten kommen aus einem anderen Geraet (einem MPU6050) und heissen
  # bei jedem anders.
  #
  # Gefunden wie oben: Entwicklerwerkzeuge -> Zustaende -> nach „neigung"
  # filtern. Beide muessen GRAD liefern (`unit_of_measurement: deg`).
  entity_neigung_lr: sensor.heizung_neigung_links_rechts
  entity_neigung_vh: sensor.heizung_neigung_vorne_hinten

  # Ab welchem Tempo die Wasserwaage erscheint (km/h).
  #
  # Nicht 0: ein stehendes Fahrzeug meldet durch das GPS-Rauschen selten
  # exakt null. Zwei km/h ist langsamer als Schrittgeschwindigkeit -- wer so
  # fuhr, parkt.
  wasserwaage_ab_kmh: "2"

  # Ab wann gilt „steht gerade"? In Grad.
  #
  # Eine Libelle, die erst bei 0,0 gruen wird, wird nie gruen. Ein halbes
  # Grad sind auf 2,5 m Fahrzeugbreite rund 2 cm Hoehenunterschied -- darunter
  # merkt es im Wohnmobil niemand mehr.
  wasserwaage_gerade_grad: "0.5"

  # Welcher Neigung entspricht der Rand der Libelle? In Grad.
  #
  # Fuenf Grad sind auf 2,5 m rund 22 cm -- mehr gleicht keine Auffahrkeil
  # aus. Ein groesserer Bereich machte die Blase im interessanten Bereich
  # traege, ein kleinerer liesse sie staendig am Rand kleben.
  wasserwaage_bereich_grad: "5"

  # ─── DIE VORZEICHEN ───────────────────────────────────────────────────────
  # `1` oder `-1`. Welches Vorzeichen welche Seite meint, haengt davon ab, wie
  # der Sensor im Fahrzeug EINGEBAUT ist -- das kann diese Datei nicht wissen,
  # und Raten waere hier besonders aergerlich: eine spiegelverkehrte
  # Wasserwaage schickt den Keil unter das falsche Rad.
  #
  # So pruefen Sie es: eine Seite anheben (oder sich auf eine Seite stellen).
  # Wandert die Blase zur ANGEHOBENEN Seite, stimmt es -- wie bei einer
  # echten Libelle. Wandert sie zur anderen, hier auf `-1` stellen.
  neigung_lr_vorzeichen: "1"
  neigung_vh_vorzeichen: "1"

  # ─── PINS DES ESP32-2424S012 ──────────────────────────────────────────────
  # Fuer ein anderes Board anpassen; README.md nennt die gaengigen.
  pin_sck: GPIO6
  pin_mosi: GPIO7
  pin_cs: GPIO10
  pin_dc: GPIO2
  pin_backlight: GPIO3

esphome:
  name: ${geraetename}
  friendly_name: ${anzeigename}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # `INFO` statt `DEBUG`: auf `DEBUG` protokolliert die API jede eingehende
  # Zustandsaenderung, und Yapaia schickt im Sekundentakt. Auf dem C3 kostet
  # das ausserdem Arbeitsspeicher, von dem es hier wenig gibt.
  level: INFO
  # Der C3 hat keinen USB-UART-Bruecke-Chip, sondern USB-Serial-JTAG direkt.
  hardware_uart: USB_SERIAL_JTAG

# ─── API UND OTA ────────────────────────────────────────────────────────────
# Beide Bloecke legt der ESPHome Device Builder beim Anlegen des Geraets
# selbst an. `ota:` steht hier genau so, wie er es schreibt.
#
# Beim SCHLUESSEL geht diese Datei bewusst einen anderen Weg als der Device
# Builder: er traegt ihn unmittelbar ein, hier steht ein Verweis auf
# `secrets.yaml`. Der Grund steht unten.
#
# ─── WAS HIER VORHER STAND UND WARUM ES STOERTE ─────────────────────────────
# Bis 0.13.1 standen hier zwei `!secret`-Verweise:
#
#     key:      !secret yapaja_display_api_key
#     password: !secret yapaja_display_ota_password
#
# Das ist fuer eine von Hand gepflegte Konfiguration richtig. Fuer den
# Device Builder ist es falsch: der erzeugt den Schluessel selbst und traegt
# ihn unmittelbar ein, und er legt WEDER den einen noch den anderen Eintrag
# in `secrets.yaml` an. Wer diese Datei also uebernahm, bekam zwei
# Verweise auf Eintraege, die es nicht gab -- und musste sie von Hand
# nachtragen, bevor ueberhaupt etwas uebersetzte.
#
# Abgeglichen mit einer laufenden Installation (Device Builder 1.14.9,
# ESPHome 2026.9.0).
api:
  encryption:
    # Der Schluessel steht in `secrets.yaml`, nicht hier.
    #
    # ─── WARUM NICHT UNMITTELBAR EINGETRAGEN ────────────────────────────────
    # Ein Geraeteschluessel gehoert in die Installation und nicht in den
    # Quelltext: hier stuende er im Repository, waere auf jedem Geraet
    # derselbe und laege offen.
    #
    # Der Name ist der des Betreibers -- bewusst NICHT `yapaja_...`, denn das
    # Geraet heisst in seiner ESPHome-Installation `navi`, und `secrets.yaml`
    # gehoert der Installation, nicht dieser Datei. Wer einen anderen Namen
    # benutzt, aendert ihn hier.
    #
    #   secrets.yaml:
    #     navi__api_key: "…"      # 32 Byte base64
    #
    # Den Wert erzeugt der ESPHome Device Builder beim Anlegen des Geraets --
    # er steht dann in dessen Geraetedatei und laesst sich von dort in die
    # `secrets.yaml` uebernehmen.
    key: !secret navi__api_key

# Ohne `password:`. Der Device Builder vergibt keines, und OTA ist bereits
# durch den API-Schluessel geschuetzt. Eine Zeile, die auf einen nicht
# vorhandenen Eintrag verweist, haette das Uebersetzen verhindert.
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Im Fahrzeug faellt das WLAN oefter aus als daheim. Der Zugangspunkt ist
  # die Rueckfalltuer, um das Geraet ohne Werkstattbesuch neu einzurichten.
  ap:
    ssid: "${geraetename} Fallback"

captive_portal:

# ─── ZEIT ───────────────────────────────────────────────────────────────────
# Liefert die Uhrzeit UND die Zeitzone, ohne die `ESPTime::from_epoch_local()`
# unten nichts umzurechnen haette.
time:
  - platform: homeassistant
    id: ha_zeit
    timezone: ${zeitzone}

# ─── DIE WERTE AUS YAPAIA ───────────────────────────────────────────────────
# Alle ohne `name:`, damit sie NICHT als neue Entitaeten nach Home Assistant
# zurueckgemeldet werden. Sie kommen von dort; sie dort noch einmal anzulegen
# waere ein zweiter Satz Entitaeten mit denselben Werten.
sensor:
  - platform: homeassistant
    id: yapaja_tempo
    entity_id: ${entity_praefix}_speed
  - platform: homeassistant
    id: yapaja_tempolimit
    entity_id: ${entity_praefix}_speed_limit

  # ─── WAS DIESES FAHRZEUG DARF ─────────────────────────────────────────────
  # Getrennt vom Schild und nicht damit verrechnet. Auf einer unbegrenzten
  # Autobahn ist das Schild `unknown` und dieser Wert 80 -- zusammengelegt
  # stuende „80" in einem runden Verkehrszeichen, das dort gar nicht steht.
  - platform: homeassistant
    id: yapaja_tempolimit_fahrzeug
    entity_id: ${entity_praefix}_speed_limit_vehicle

  # ─── DIE NEIGUNG, FUER DIE WASSERWAAGE ────────────────────────────────────
  # Aus einem ANDEREN Geraet als der Rest dieser Anzeige -- deshalb eigene
  # Einstellungen oben und nicht der `entity_praefix`.
  - platform: homeassistant
    id: neigung_lr
    entity_id: ${entity_neigung_lr}
  - platform: homeassistant
    id: neigung_vh
    entity_id: ${entity_neigung_vh}
  - platform: homeassistant
    id: yapaja_manoever_entfernung
    entity_id: ${entity_praefix}_instruction_distance

binary_sensor:
  - platform: homeassistant
    id: yapaja_zu_schnell
    entity_id: ${entity_praefix_binaer}_speeding

text_sensor:
  # Der Anweisungstext, bereits auf Deutsch formuliert ("Links abbiegen auf B27").
  - platform: homeassistant
    id: yapaja_anweisung
    entity_id: ${entity_praefix}_instruction
  # Die Art des Manoevers — daraus wird der Pfeil. Steht im Attribut, nicht
  # im Zustand.
  - platform: homeassistant
    id: yapaja_manoever_art
    entity_id: ${entity_praefix}_instruction
    attribute: type
  # idle | routing | navigating | paused | arrived | off_route
  - platform: homeassistant
    id: yapaja_fahrzustand
    entity_id: ${entity_praefix}_nav_state
  # ISO 8601 in UTC. Wird unten umgerechnet, nicht abgeschnitten.
  - platform: homeassistant
    id: yapaja_ankunft
    entity_id: ${entity_praefix}_eta

# ─── HINTERGRUNDBELEUCHTUNG ─────────────────────────────────────────────────
# Als Licht ausgefuehrt, damit Home Assistant sie dimmen kann — nachts im
# Fahrerhaus ist ein Display auf voller Helligkeit blendend.
output:
  - platform: ledc
    pin: ${pin_backlight}
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Helligkeit"
    id: backlight
    restore_mode: ALWAYS_ON

color:
  - id: c_hintergrund
    hex: "0B0F14"
  - id: c_text
    hex: "F2F5F7"
  - id: c_gedaempft
    hex: "8A949E"
  - id: c_pfeil
    hex: "4EA1FF"
  - id: c_warnung
    hex: "FF4D4D"
  - id: c_gut
    hex: "3DDC84"
  - id: c_schild
    hex: "FFFFFF"

# ─── SCHRIFTEN ──────────────────────────────────────────────────────────────
# `glyphs` ausdruecklich gesetzt: die Vorgabe von ESPHome kennt kein ä, ö, ü
# oder ß. Deutsche Strassennamen bestehen zu einem guten Teil daraus, und ein
# fehlendes Zeichen wird stillschweigend ausgelassen — aus "Grünstraße" wird
# "Grnstrae", ohne Warnung.
#
# Kleiner als auf einem eckigen Panel: 240 runde Bildpunkte sind wenig, und
# jede Schriftgroesse kostet auf dem C3 zusaetzlich Arbeitsspeicher.
font:
  - file: "gfonts://Roboto@700"
    id: font_xl
    size: 40
    glyphs: &zeichen "!\"%()+=,-_.:/°'’ 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß"
  - file: "gfonts://Roboto@700"
    id: font_l
    size: 26
    glyphs: *zeichen
  - file: "gfonts://Roboto@500"
    id: font_m
    size: 18
    glyphs: *zeichen
  - file: "gfonts://Roboto@400"
    id: font_s
    size: 13
    glyphs: *zeichen

spi:
  clk_pin: ${pin_sck}
  mosi_pin: ${pin_mosi}

display:
  - platform: ili9xxx
    model: GC9A01A
    id: anzeige
    cs_pin: ${pin_cs}
    dc_pin: ${pin_dc}
    # KEIN `reset_pin`: auf dem ESP32-2424S012 ist RESET des Panels nicht auf
    # einen GPIO gefuehrt. Einen anzugeben, der nicht verdrahtet ist, laesst
    # das Display schwarz — der haeufigste Stolperstein bei diesem Board.
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    # ─── WARUM 8 BIT UND NICHT DIE VOREINSTELLUNG ──────────────────────────
    # Gemeldet vom Geraet, direkt nach dem Flashen:
    #
    #   [E][display:016]: Could not allocate buffer for display!
    #   [E][component:204]: display was marked as failed
    #
    # Der Bildpuffer passte nicht in den Arbeitsspeicher. Nachgerechnet aus
    # ESPHomes eigenem Quelltext statt geschaetzt:
    #
    #   ili9xxx_display.h:   ILI9XXXColorMode buffer_color_mode_{BITS_16};
    #   ili9xxx_display.cpp: if (buffer_color_mode_ == BITS_16)
    #                          init_internal_(get_buffer_length_() * 2);
    #
    # Voreinstellung ist also 16 Bit je Bildpunkt:
    #
    #   240 x 240 x 2 Byte = 115 200 Byte -- AM STUECK.
    #
    # Der ESP32-C3 auf diesem Board hat 400 kB SRAM und KEIN PSRAM. Davon
    # gehen WLAN-Stapel, TCP/IP und die verschluesselte API ab, und was
    # uebrig bleibt, ist nach dem Start des Funks zerstueckelt. Ein
    # zusammenhaengender Block von 115 kB ist dort die Ausnahme, nicht die
    # Regel -- deshalb ist das Display gescheitert, waehrend alles andere
    # weiterlief.
    #
    # `8BIT` halbiert ihn auf 57 600 Byte. Gespeichert wird dann RGB332
    # (ili9xxx_display.cpp, Zweig `default:` -> `color_to_332`); eine Palette
    # braucht es dafuer NICHT.
    #
    # Der Preis: 256 statt 65 536 Farben. Fuer diese Anzeige ist das
    # folgenlos -- dunkler Grund, weisser und gedaempfter Text, ein blauer
    # Pfeil, rot fuer zu schnell, gruen fuer gut. Farbverlaeufe gibt es hier
    # keine, an denen eine Abstufung auffiele.
    color_palette: 8BIT
    # Yapaia meldet im Sekundentakt; 500 ms zeichnen ist fluessig genug und
    # laesst dem Funk Luft. Auf dem C3 ist beides knapp.
    update_interval: 500ms
    lambda: |-
      // ══ Der Kreis ══════════════════════════════════════════════════════
      // Auf einem runden Glas sind die Ecken nicht da. Was dort gezeichnet
      // wird, ist nicht "abgeschnitten" -- es ist weg, ohne dass am Geraet
      // etwas darauf hindeutet. Deshalb rechnet die ganze Aufteilung unten
      // mit der HALBBREITE AUF HOEHE y statt mit der Bildbreite.
      const int B = it.get_width();
      const int H = it.get_height();
      const int cx = B / 2;
      const int cy = H / 2;
      const bool rund = ${rund};
      // 8 Bildpunkte Rand: die Fassung des Moduls verdeckt den aeussersten
      // Ring, und Buchstaben genau auf der Kante sind schlecht zu lesen.
      const int r = (rund ? std::min(B, H) / 2 : std::min(B, H) / 2) - 8;

      auto halbbreite = [&](int y) -> int {
        if (!rund) return B / 2 - 6;
        const int dy = y - cy;
        const int q = r * r - dy * dy;
        return q <= 0 ? 0 : (int) std::sqrt((double) q);
      };

      it.fill(id(c_hintergrund));

      // Ist ein Wert ueberhaupt da? Home Assistant schickt fuer "weiss ich
      // nicht" NaN, und `NaN` ungeprueft zu drucken ergibt nicht "nan",
      // sondern "-2147483648".
      //
      // ─── ZEIGER, NICHT REFERENZ ───────────────────────────────────────
      // Hier stand eine Referenz, mit der Begruendung, `id(...)` liefere in
      // ESPHome das Objekt selbst. Das war falsch, und der Bau auf dem
      // Geraet ist genau daran gescheitert:
      //
      //   no known conversion for argument 1 from
      //   'esphome::homeassistant::HomeassistantSensor* const'
      //   to 'esphome::sensor::Sensor&'
      //
      // Nachgelesen in ESPHomes `cpp_generator.py` (process_lambda):
      //
      //   if parts[i * 3 + 2] == ".":
      //       parts[i * 3 + 1] = var._     // ergibt "name->"
      //   else:
      //       parts[i * 3 + 1] = var       // ergibt "name" -- den ZEIGER
      //
      // `id(x)` wird also zum Zeiger; nur `id(x).` wird zu `x->`. Deshalb
      // funktioniert die Punktschreibweise ueberall sonst in dieser Datei
      // und ausgerechnet hier nicht.
      //
      // Der Nullzeiger-Vergleich kostet nichts und deckt den Fall ab, dass
      // eine Entitaet in Home Assistant gar nicht existiert.
      auto hat = [](esphome::sensor::Sensor *s) {
        return s != nullptr && s->has_state() && !std::isnan(s->state);
      };

      // ══ Beim Parken: die digitale Wasserwaage ══════════════════════════
      // Steht das Wohnmobil gerade? Das ist beim Abstellen die einzige
      // Frage, und sie geht jeder Navigationsanzeige vor.
      //
      // ─── NUR BEI BEKANNTEM, LANGSAMEM TEMPO ───────────────────────────
      // `hat(...)` ist hier keine Formsache. Ist das Tempo UNBEKANNT, wissen
      // wir nicht, ob das Fahrzeug steht -- dann waere eine Wasserwaage
      // mitten auf der Autobahn zu sehen. Unbekannt heisst also: weiter wie
      // bisher, nicht „vermutlich steht es".
      // ─── WARUM `(float) (...)` UND NICHT `...f` ───────────────────────
      // Eine Substitution wird als TEXT eingesetzt. Aus `2` wuerde mit
      // angehaengtem `f` die Zeichenfolge `2f` -- und das ist kein
      // Gleitkommaliteral, sondern ein unbekannter Literal-Operator:
      //
      //   error: unable to find numeric literal operator 'operator""f'
      //
      // Mit `0.5` ginge es gut, mit `2` nicht. Wer oben also eine glatte
      // Zahl eintraegt, haette den Bau zerlegt -- und zwar erst beim
      // Uebersetzen auf dem eigenen Geraet. Die Klammer nimmt beide Formen.
      if (hat(id(yapaja_tempo)) && id(yapaja_tempo).state < (float) (${wasserwaage_ab_kmh})) {
        const float rr = r - 4;

        // ─── OHNE NEIGUNGSWERTE KEINE BLASE ─────────────────────────────
        // Eine Blase in der Mitte heisst „steht gerade". Fehlen die Werte,
        // waere genau das eine Behauptung -- und zwar die beruhigende, bei
        // der niemand nachsieht. Also lieber schreiben, was fehlt.
        if (!hat(id(neigung_lr)) || !hat(id(neigung_vh))) {
          it.circle(cx, cy, (int) rr, id(c_gedaempft));
          it.print(cx, cy - 10, id(font_s), id(c_warnung), TextAlign::CENTER,
                   "Keine Neigungswerte");
          it.print(cx, cy + 10, id(font_s), id(c_gedaempft), TextAlign::CENTER,
                   "Sensoren pruefen");
          return;
        }

        // Vorzeichen aus den substitutions -- welche Seite welches Vorzeichen
        // meint, haengt vom Einbau des Sensors ab (siehe oben).
        const float lr = id(neigung_lr).state * (float) (${neigung_lr_vorzeichen});
        const float vh = id(neigung_vh).state * (float) (${neigung_vh_vorzeichen});

        const float bereich = (float) (${wasserwaage_bereich_grad});
        const float gerade  = (float) (${wasserwaage_gerade_grad});
        const bool steht_gerade = fabsf(lr) <= gerade && fabsf(vh) <= gerade;

        // ─── DIE LIBELLE ────────────────────────────────────────────────
        // Aussenring, ein Ring fuer „gerade genug", und ein Fadenkreuz. Die
        // beiden Ringe geben der Blase einen Bezug: ohne sie waere jede
        // Lage gleich weit von „gut" entfernt.
        it.circle(cx, cy, (int) rr, id(c_gedaempft));
        const int gut_r = (int) (rr * gerade / bereich);
        it.circle(cx, cy, gut_r, steht_gerade ? id(c_gut) : id(c_gedaempft));
        it.line(cx - (int) rr, cy, cx + (int) rr, cy, id(c_gedaempft));
        it.line(cx, cy - (int) rr, cx, cy + (int) rr, id(c_gedaempft));

        // ─── DIE BLASE ──────────────────────────────────────────────────
        // Wie bei einer echten Libelle: sie wandert zur ANGEHOBENEN Seite.
        // Am Rand bleibt sie stehen, statt aus dem Glas zu laufen -- eine
        // Blase ausserhalb waere unsichtbar, und unsichtbar sieht aus wie
        // „keine Neigung".
        float bx = lr / bereich;
        float by = -vh / bereich;
        const float weite = sqrtf(bx * bx + by * by);
        if (weite > 1.0f) { bx /= weite; by /= weite; }

        const int blase_r = std::max(6, (int) (rr / 6));
        const int px = cx + (int) (bx * (rr - blase_r));
        const int py = cy + (int) (by * (rr - blase_r));
        it.filled_circle(px, py, blase_r, steht_gerade ? id(c_gut) : id(c_warnung));

        // ─── DIE ZAHLEN ─────────────────────────────────────────────────
        // Die Blase zeigt die Richtung, die Zahlen das Mass. Eine Nachkomma-
        // stelle: das Grad selbst ist zu grob zum Ausrichten, zwei Stellen
        // flackern im Sekundentakt.
        it.printf(cx, cy + (int) (rr * 0.52f), id(font_s), id(c_text), TextAlign::CENTER,
                  "L/R %+.1f°", lr);
        it.printf(cx, cy + (int) (rr * 0.72f), id(font_s), id(c_text), TextAlign::CENTER,
                  "V/H %+.1f°", vh);
        if (steht_gerade) {
          it.print(cx, cy - (int) (rr * 0.62f), id(font_s), id(c_gut), TextAlign::CENTER,
                   "steht gerade");
        }
        return;
      }

      // ══ Fahrzustand ════════════════════════════════════════════════════
      const std::string zustand = id(yapaja_fahrzustand).state;
      if (zustand != "navigating") {
        const char *text = "Keine Route";
        if (zustand == "routing")   text = "Route wird berechnet";
        if (zustand == "paused")    text = "Pausiert";
        if (zustand == "arrived")   text = "Angekommen";
        if (zustand == "off_route") text = "Abseits der Route";
        // ─── „KEINE VERBINDUNG" WAR FALSCH ────────────────────────────
        // Hier stand dieses Wort. Gemeldet mit Foto: das Geraet zeigte es,
        // waehrend es in ESPHome als „Geraet online" mit IP-Adresse
        // dastand. Beides stimmte — die WLAN- und API-Verbindung war da,
        // nur die ENTITAET lieferte keinen Wert.
        //
        // Der Satz schickte damit genau dorthin, wo nichts zu finden war:
        // zum Router, zum WLAN, zur API. Der wahrscheinliche Grund liegt
        // ganz woanders, naemlich beim Namen der Entitaet (siehe
        // `entity_praefix` oben in den substitutions).
        //
        // Das ist dieselbe Fehlerklasse, die dieses Projekt seit Monaten
        // verfolgt: eine Meldung, die einen Zustand beschreibt, den sie
        // nicht hat — und die Suche in die falsche Richtung lenkt.
        //
        // Zwei Zeilen, weil eine nicht reicht: die erste sagt, WAS fehlt,
        // die zweite, WO man nachsieht. Auf 240 runden Bildpunkten ist das
        // die kuerzeste ehrliche Fassung.
        // ─── „unknown" GEHOERT HIER DAZU ───────────────────────────────
        // Diese Pruefung kannte nur `empty()` und "unavailable". Home
        // Assistant schickt fuer einen Sensor ohne Wert aber die
        // Zeichenkette "unknown" -- weiter unten in derselben Datei wird
        // genau darauf geprueft (beim Anweisungstext). Hier fehlte sie.
        //
        // Die Folge waere die schlimmere Haelfte dieses ganzen Themas
        // gewesen: aus einem FEHLENDEN Wert wurde die feste Aussage „Keine
        // Route". Das Geraet haette also behauptet, es sei alles in
        // Ordnung und es liege nur nichts an -- waehrend es in Wahrheit gar
        // nichts wusste.
        if (zustand.empty() || zustand == "unavailable" || zustand == "unknown") {
          it.print(cx, cy - 10, id(font_s), id(c_warnung), TextAlign::CENTER,
                   "Kein Wert aus Home Assistant");
          it.print(cx, cy + 10, id(font_s), id(c_gedaempft), TextAlign::CENTER,
                   "Entitaet pruefen: Filter \"yapa\"");
          return;
        }

        // ─── OHNE ROUTE IST DAS TEMPO DAS WICHTIGSTE ──────────────────────
        // Gemeldet ueber die Entwicklerwerkzeuge: bei `nav_state: idle`
        // standen `speed` und `altitude` auf "unknown", obwohl der
        // device_tracker im selben Augenblick eine Position fuehrte. Seit
        // 0.13.1 holt der Kern beides aus dem GPS, sobald ein Fix da ist.
        //
        // Damit hat dieses Display auch OHNE Route etwas zu zeigen -- und
        // zwar das, wofuer man im Fahrzeug auf einen Tacho sieht. Vorher
        // stand hier auf einem fest verbauten Bildschirm dauerhaft nur
        // „Keine Route".
        //
        // Der Zustandstext bleibt darunter stehen, klein und gedaempft: er
        // ist die Nebenauskunft, nicht die Hauptsache.
        if (hat(id(yapaja_tempo))) {
          // `it.printf` und dieselbe Rundung wie in der Fahransicht weiter
          // unten -- kein `snprintf`, kein `lroundf`: dafuer muesste diese
          // Datei Header einbinden, die sie bisher nicht braucht, und zwei
          // verschiedene Rundungen fuer dasselbe Tempo waeren ohnehin eine
          // Stelle, an der die beiden Ansichten auseinanderlaufen koennten.
          it.printf(cx, cy - 18, id(font_l), id(c_text), TextAlign::CENTER,
                    "%d", (int) (id(yapaja_tempo).state + 0.5f));
          it.print(cx, cy + 14, id(font_s), id(c_gedaempft), TextAlign::CENTER, "km/h");
          it.print(cx, cy + 36, id(font_s), id(c_gedaempft), TextAlign::CENTER, text);
          return;
        }

        it.print(cx, cy, id(font_m), id(c_gedaempft), TextAlign::CENTER, text);
        return;
      }

      // ══ Oben: der Anweisungstext ═══════════════════════════════════════
      // Gekuerzt nach ZEICHENZAHL, geschaetzt aus der verfuegbaren Breite.
      // Das ist eine Schaetzung und als solche gemeint: die tatsaechliche
      // Breite einer Zeichenkette kennt nur die Schrift. Lieber ein Wort zu
      // frueh abgeschnitten als eines, das im Rund verschwindet.
      const int ty = cy - (r * 62) / 100;
      const int platz = (halbbreite(ty) * 2) / 7;   // ~7 Bildpunkte je Zeichen
      std::string anweisung = id(yapaja_anweisung).state;
      if (anweisung == "unknown" || anweisung == "unavailable") anweisung.clear();
      if (platz > 1 && (int) anweisung.size() > platz) {
        // ─── NICHT MITTEN IN EIN ZEICHEN SCHNEIDEN ──────────────────────
        // `std::string` zaehlt BYTES. „ß", „ü", „ä" sind in UTF-8 zwei Bytes
        // lang, und deutsche Strassennamen bestehen zu einem guten Teil
        // daraus. Faellt der Schnitt zwischen die beiden Bytes, entsteht
        // kein Zeichen, sondern Bruch -- die Schrift zeigt dann ein
        // Ersatzkaestchen oder gar nichts, mitten im Strassennamen.
        //
        // Also zurueck bis zum Anfang des Zeichens: Folgebytes eines
        // UTF-8-Zeichens haben immer das Bitmuster 10xxxxxx.
        size_t schnitt = (size_t) platz - 1;
        while (schnitt > 0 && ((unsigned char) anweisung[schnitt] & 0xC0) == 0x80) {
          schnitt--;
        }
        anweisung = anweisung.substr(0, schnitt) + "…";
      }
      it.print(cx, ty, id(font_s), id(c_gedaempft), TextAlign::CENTER, anweisung.c_str());

      // ══ Mitte: der Manoeverpfeil ═══════════════════════════════════════
      // Gezeichnet, nicht als Symbolschrift geladen: so haengt die Anzeige
      // an keiner Schriftdatei und keinen Zeichen-Nummern, die beim
      // naechsten Aktualisieren der Schrift verrutschen koennen -- und auf
      // dem C3 spart es den Speicher einer weiteren Schrift.
      //
      // Eingeordnet wird ueber Teilzeichenketten. `ManeuverType` ist in
      // `packages/shared/src/types.ts` ausdruecklich `| string` -- Valhalla
      // liefert auch `slight_left`, `sharp_right`, `ramp_left`, `merge` und
      // anderes. Wer auf genaue Gleichheit prueft, bekommt bei jedem dieser
      // Werte den Geradeaus-Pfeil, also die falsche Richtung.
      const std::string art = id(yapaja_manoever_art).state;
      auto enthaelt = [&](const char *teil) {
        return art.find(teil) != std::string::npos;
      };

      const int py = cy - (r * 20) / 100;
      // Die Kantenlaenge kommt aus `r`, also aus der KLEINEREN Seite. Damit
      // passt der Pfeil in jedem Seitenverhaeltnis; eine zusaetzliche
      // Begrenzung auf die Halbbreite stand hier zunaechst, konnte aber nie
      // greifen -- der Prueflauf zeigte, dass sie sich entfernen laesst, ohne
      // dass ein Fall anders ausgeht. Beiwerk, das Sicherheit nur vortaeuscht.
      const int s = (r * 30) / 100;
      const int d = s / 3;
      auto C = id(c_pfeil);

      if (enthaelt("uturn")) {
        const int seite = enthaelt("uturn_right") ? 1 : -1;
        it.filled_rectangle(cx - d / 2, py - s / 3, d, s + s / 3, C);
        it.filled_rectangle(cx - d / 2, py - s, d + seite * s, d, C);
        const int ex = cx + seite * s;
        it.filled_rectangle(ex - d / 2, py - s, d, s / 2, C);
        it.filled_triangle(ex - s / 2, py - s / 2, ex + s / 2, py - s / 2, ex, py + s / 4, C);
      } else if (enthaelt("roundabout")) {
        it.filled_ring(cx, py, (s * 2) / 3, (s * 2) / 5, C);
        it.filled_rectangle(cx - d / 2, py, d, s, C);
        const int seite = enthaelt("left") ? -1 : 1;
        const int ax = cx + (seite * s * 2) / 3;
        it.filled_rectangle(cx, py - (s * 2) / 3 - d / 2, (seite * s * 2) / 3, d, C);
        it.filled_triangle(ax, py - s, ax, py - s / 3, ax + seite * s / 2, py - (s * 2) / 3, C);
      } else if (enthaelt("left") || enthaelt("right")) {
        const int seite = enthaelt("right") ? 1 : -1;
        it.filled_rectangle(cx - d / 2, py, d, s, C);
        it.filled_rectangle(cx - d / 2, py, (seite * s * 2) / 3, d, C);
        const int ex = cx + (seite * s * 2) / 3;
        it.filled_triangle(ex, py - s / 2, ex, py + s / 2 + d, ex + seite * s / 2, py + d / 2, C);
      } else {
        // Geradeaus -- und alles, was wir nicht einordnen koennen. Ein Pfeil
        // nach vorn ist bei `merge`, `continue` oder `destination` nicht
        // falsch; gar nichts zu zeichnen waere schlechter.
        it.filled_rectangle(cx - d / 2, py - s / 3, d, s + s / 3, C);
        it.filled_triangle(cx - s / 2, py - s / 3, cx + s / 2, py - s / 3, cx, py - s, C);
      }

      // ══ Darunter: die Entfernung, gross ════════════════════════════════
      // Unter 1000 m in Metern, darueber in Kilometern. Auf 10 m gerundet:
      // "483 m" taeuscht eine Genauigkeit vor, die GPS nicht hat, und die
      // letzte Ziffer flackerte im Sekundentakt.
      const int dy_ = cy + (r * 28) / 100;
      if (hat(id(yapaja_manoever_entfernung))) {
        const float m = id(yapaja_manoever_entfernung).state;
        if (m >= 1000.0f) {
          it.printf(cx, dy_, id(font_xl), id(c_text), TextAlign::CENTER, "%.1f km", m / 1000.0f);
        } else {
          it.printf(cx, dy_, id(font_xl), id(c_text), TextAlign::CENTER,
                    "%d m", ((int) (m / 10.0f + 0.5f)) * 10);
        }
      } else {
        it.print(cx, dy_, id(font_xl), id(c_gedaempft), TextAlign::CENTER, "--");
      }

      // ══ Unten: Tempo · Tempolimit · Ankunft ════════════════════════════
      const int uy = cy + (r * 68) / 100;
      const int hb = halbbreite(uy);

      const bool zu_schnell = id(yapaja_zu_schnell).state;
      if (hat(id(yapaja_tempo))) {
        it.printf(cx - hb + 2, uy, id(font_l),
                  zu_schnell ? id(c_warnung) : id(c_text), TextAlign::CENTER_LEFT,
                  "%d", (int) (id(yapaja_tempo).state + 0.5f));
      }

      // Weisser Ring mit rotem Rand, wie das Verkehrszeichen. NUR wenn die
      // Karte eines kennt -- ein leeres oder auf 0 stehendes Schild waere die
      // Behauptung, hier gelte Tempo 0.
      const int sr = std::min(15, r / 7);
      if (hat(id(yapaja_tempolimit))) {
        it.filled_circle(cx, uy, sr, id(c_warnung));
        it.filled_circle(cx, uy, (sr * 72) / 100, id(c_schild));
        it.printf(cx, uy, id(font_s), id(c_hintergrund), TextAlign::CENTER,
                  "%d", (int) (id(yapaja_tempolimit).state + 0.5f));
      }

      // ─── DIE FAHRZEUGGRENZE, KLEIN UND OHNE SCHILD ────────────────────
      // Ein Wohnmobil ueber 3,5 t darf weniger als das Schild erlaubt. Diese
      // Zahl steht deshalb DANEBEN und NICHT im runden Zeichen: ein
      // Verkehrszeichen behauptet, dass es draussen steht, und dieses stuende
      // dort nicht.
      //
      // Gezeigt nur, wenn sie ueberhaupt etwas Neues sagt -- also wenn sie
      // NIEDRIGER ist als das Schild oder es gar keines gibt. Eine Zahl, die
      // dasselbe sagt wie das Zeichen daneben, ist auf 240 runden
      // Bildpunkten verschenkter Platz.
      if (hat(id(yapaja_tempolimit_fahrzeug))) {
        const int fz = (int) (id(yapaja_tempolimit_fahrzeug).state + 0.5f);
        const bool sagt_etwas =
            !hat(id(yapaja_tempolimit)) ||
            fz < (int) (id(yapaja_tempolimit).state + 0.5f);
        if (sagt_etwas) {
          it.printf(cx + sr + 4, uy, id(font_s), id(c_warnung), TextAlign::CENTER_LEFT,
                    "%d", fz);
        }
      }

      // Yapaia liefert die Ankunft als ISO 8601 in UTC. Hier wird sie
      // GERECHNET, nicht abgeschnitten: `14:32Z` ist in Deutschland 16:32,
      // im Winter 15:32. Ein `substr(11, 5)` waere kuerzer und im Sommer
      // zwei Stunden falsch.
      const std::string iso = id(yapaja_ankunft).state;
      int Y, Mo, D, h, mi, se;
      if (sscanf(iso.c_str(), "%4d-%2d-%2dT%2d:%2d:%2d", &Y, &Mo, &D, &h, &mi, &se) == 6) {
        esphome::ESPTime t{};
        t.year = Y; t.month = Mo; t.day_of_month = D;
        t.hour = h; t.minute = mi; t.second = se;
        // `false`: die Nummer des Tages im Jahr ist oben nicht gesetzt,
        // gerechnet wird aus dem Datum.
        t.recalc_timestamp_utc(false);
        auto lokal = esphome::ESPTime::from_epoch_local(t.timestamp);
        it.printf(cx + hb - 2, uy, id(font_m), id(c_gut), TextAlign::CENTER_RIGHT,
                  "%02d:%02d", lokal.hour, lokal.minute);
      } else {
        // "unknown", "unavailable" oder leer -- dann steht hier nichts
        // Erfundenes.
        it.print(cx + hb - 2, uy, id(font_m), id(c_gedaempft), TextAlign::CENTER_RIGHT, "--:--");
      }
